case: "data_generation/andes_cases/ieee39_full_ibrs.xlsx"
output_dir: "results/thesis_data_generation_results/results/line_outages_only"
output_csv: "simulation_results.csv"
feature_names_path: "configs/data_generation_feature_names.yaml"
seed: 42
n_sims: 20000
workers: 128
stream_level: 50

base_load_scale:
  low: 0.6
  high: 1.0

contingency:
  load_step:
    enable: false
    time: 1.0
    scale:
      low: 0.7
      high: 1.3
  line_n1:
    enable: true
    trip_time: 1.0
    line_ids: ["Line_1", "Line_2", "Line_3", "Line_4", "Line_5", "Line_6", "Line_7", "Line_8", "Line_9", "Line_10", "Line_11", "Line_12", "Line_13", "Line_14", "Line_15", "Line_16", "Line_17", "Line_18", "Line_19", "Line_20", "Line_21", "Line_22", "Line_23", "Line_24", "Line_25", "Line_26", "Line_27", "Line_28", "Line_29", "Line_30", "Line_31", "Line_32", "Line_33", "Line_34", "Line_35", "Line_36", "Line_37", "Line_38", "Line_39"]
    max_lines: 1

ibr:
  model: "REGCV1"
  n_ibr: 4
  indices: []
  M_range: [0.0, 8.0]
  D_range: [0.0, 6.0]

load:
  pq_names: ["PQ_1", "PQ_2", "PQ_3", "PQ_4", "PQ_5", "PQ_6", "PQ_7", "PQ_8", "PQ_9", "PQ_10", "PQ_11", "PQ_12", "PQ_13", "PQ_14", "PQ_15", "PQ_16", "PQ_17", "PQ_18", "PQ_19"]
  pq_bus_ids: []
  scale_pv: false
  owners: []

ed:
  enable: true
  ibr_idx: [0, 5, 7, 8]
  cost_table_path: "configs/table_3_1_dispatch_costs.yaml"
  solver: "OSQP"
  verbose: false
  line_limits_enable: true

tds:
  t_end: 60.0
  t_step: 0.1
  method: "backeuler"
  max_iter: 35
  tol: 1.0e-3
  honest: 1
  fixt: 0
  shrinkt: 1
  criteria: 0
  no_tqdm: true
