output_dir: thesis_model_results/outputs/feature_relevance_attention
skip_if_exists: true
seed: 42

model:
  shared_sizes: [256, 128]
  group_shared_sizes: [128, 64]
  head_sizes: [64]
  group_head_indices: [[0, 1], [2, 3, 4, 5]]
  activation: relu
  dropout: 0.0
  attention_hidden_dim: 64
  attention_temperature: 1.0
  attention_dropout: 0.0

data:
  csv_path: results/to_export/simulation_results.csv
  target_cols: [rocof_COI, dev_COI, Delta_P_IBR_1, Delta_P_IBR_2, Delta_P_IBR_3, Delta_P_IBR_4]
  drop_cols:
    - sim_id
    - seed
    - success
    - cont_type
    - contingency_time
    - line_uid
    - line_name
    - line_from_bus
    - line_to_bus
    - time_max_dev
    - time_max_rocof
    - f_ss_COI
    - f_min_COI
    - f_max_COI
    - t_settle_COI
    - rocof_abs_COI
    - rocof_mean_COI
    - rocof_rms_COI
    - dev_abs_COI
    - bus_freq_max_abs_dev_any
    - bus_freq_mean_max_abs_dev
    - bus_freq_p95_max_abs_dev
    - bus_freq_nadir_min
    - bus_freq_zenith_max
    - bus_freq_n_buses_over_0p2
    - bus_freq_n_buses_over_0p5
    - bus_v_max_abs_dev_any
    - bus_v_mean_max_abs_dev
    - bus_v_p95_max_abs_dev
    - bus_v_min_any
    - bus_v_max_any
    - bus_v_n_buses_below_0p95
    - bus_v_n_buses_above_1p05
    - step_bin_label
    - M_bin_label
    - D_bin_label
    - plotter_csv
  drop_prefixes: [Delta_P_IBR_abs_, bus_freq_max_abs_dev_, bus_v_max_abs_dev_]
  ignore_missing_drop_cols: true
  use_recommended_scalers: false

split:
  test_size: 0.3
  val_fraction: 0.5
  random_state: 42

training:
  epochs: 200
  lr: 0.001
  weight_decay: 0.0001
  batch_train: 512
  batch_eval: 1024
  loss_weights: []
  use_lr_scheduler: true
  lr_scheduler_patience: 8
  lr_scheduler_factor: 0.5
  lr_scheduler_min_lr: 1e-7

sweep:
  models: [MTLGSH_ATT]
  losses: [mse]
  scalers: [minmax]
  seeds: [42]
  model: {}
  training: {}
  data: {}
