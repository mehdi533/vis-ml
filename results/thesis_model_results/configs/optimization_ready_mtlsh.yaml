output_dir: results/thesis_model_results/outputs/optimization_ready_mtlsh
skip_if_exists: true
seed: 42

model:
  # Small MTLSH variant sized for optimization embedding.
  shared_sizes: [32]
  head_sizes: [16]
  activation: relu
  dropout: 0.0

data:
  csv_path: results/to_export/simulation_results.csv
  feature_names_path: configs/data_generation_feature_names.yaml
  use_registry_feature_allowlist: true
  # Exact optimizer-buildable feature contract.
  # Keep this list aligned with thesis optimization x_features unless the
  # optimization builder is extended and both sides are updated together.
  feature_cols:
    - base_load_scale
    - load_step_scale
    - base_load_p_total
    - base_load_q_total
    - DELTA_PQ_tot
    - M_1
    - D_1
    - M_2
    - D_2
    - M_3
    - D_3
    - M_4
    - D_4
    - DELTA_P_PQ_1
    - DELTA_P_PQ_2
    - DELTA_P_PQ_3
    - DELTA_P_PQ_4
    - DELTA_P_PQ_5
    - DELTA_P_PQ_6
    - DELTA_P_PQ_7
    - DELTA_P_PQ_8
    - DELTA_P_PQ_9
    - DELTA_P_PQ_10
    - DELTA_P_PQ_11
    - DELTA_P_PQ_12
    - DELTA_P_PQ_13
    - DELTA_P_PQ_14
    - DELTA_P_PQ_15
    - DELTA_P_PQ_16
    - DELTA_P_PQ_17
    - DELTA_P_PQ_18
    - DELTA_P_PQ_19
    - DELTA_P_OWNER_1
    - DELTA_P_OWNER_2
    - DELTA_P_OWNER_3
    - DELTA_P_OWNER_4
    - P_GENROU_1
    - P_GENROU_2
    - P_GENROU_3
    - P_GENROU_4
    - P_GENROU_5
    - P_GENROU_6
    - P_REGCV1_1
    - P_REGCV1_2
    - P_REGCV1_3
    - P_REGCV1_4
  target_cols:
    - rocof_COI
    - dev_COI
    - Delta_P_IBR_1
    - Delta_P_IBR_2
    - Delta_P_IBR_3
    - Delta_P_IBR_4
  use_recommended_scalers: false

split:
  test_size: 0.3
  val_fraction: 0.5
  random_state: 42

training:
  epochs: 200
  lr: 0.001
  weight_decay: 0.0001
  batch_train: 512
  batch_eval: 1024
  loss_weights: []
  use_lr_scheduler: true
  lr_scheduler_patience: 8
  lr_scheduler_factor: 0.5
  lr_scheduler_min_lr: 1e-7
  save_test_predictions: true

sweep:
  models: [MTLSH]
  losses: [mse]
  scalers: [minmax]
  seeds: [42]
  model: {}
  training: {}
  data: {}
