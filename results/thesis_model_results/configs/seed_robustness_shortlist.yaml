output_dir: results/thesis_model_results/outputs/seed_robustness_shortlist
skip_if_exists: false
seed: 42

model:
  hidden_sizes: [256, 128, 64]
  shared_sizes: [256, 128]
  group_shared_sizes: [128, 64]
  head_sizes: [64]
  group_head_indices: [[0, 1], [2, 3, 4, 5]]
  activation: relu
  dropout: 0.0
  u_feature_spec:
    scalar_fields: [M_agg, D_agg, P_GENROU_TOTAL, P_REGCV1_TOTAL, P_DISPATCH_TOTAL, P_REGCV1_SHARE]
    prefixes:
      - {name: M}
      - {name: D}
      - {name: p_genrou}
      - {name: p_regcv1}
      - {name: p_genrou_reserve}
      - {name: p_regcv1_reserve}

data:
  csv_path: results/thesis_data_generation_results/results/simulation_results.csv
  feature_names_path: configs/data_generation_feature_names.yaml
  use_registry_feature_allowlist: true
  drop_metadata_fields: true
  drop_diagnostic_fields: true
  target_cols: [rocof_COI, dev_COI, Delta_P_IBR_1, Delta_P_IBR_2, Delta_P_IBR_3, Delta_P_IBR_4]
  drop_cols:
    - line_name
    - plotter_csv
    - reserve_p_genrou
    - reserve_p_ibr
    - reserve_q_genrou
    - reserve_q_ibr
  drop_prefixes: []
  ignore_missing_drop_cols: true
  use_recommended_scalers: false

split:
  test_size: 0.3
  val_fraction: 0.5
  random_state: 42

training:
  epochs: 200
  lr: 0.001
  weight_decay: 0.0001
  batch_train: 512
  batch_eval: 1024
  loss_weights: []
  use_lr_scheduler: true
  lr_scheduler_patience: 8
  lr_scheduler_factor: 0.5
  lr_scheduler_min_lr: 1e-7

sweep:
  models: [MLP, MTLSH, MTLGSH, PICNN_MTLSH]
  losses: [mse]
  scalers: [minmax]
  seeds: [21, 42, 84, 126, 168]
  model: {}
  training: {}
  data: {}
