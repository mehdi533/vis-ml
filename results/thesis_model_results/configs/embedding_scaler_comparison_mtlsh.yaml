output_dir: results/thesis_model_results/outputs/embedding_scaler_comparison_mtlsh
skip_if_exists: false
seed: 42

model:
  shared_sizes: [32]
  head_sizes: [16]
  activation: relu
  dropout: 0.0

data:
  csv_path: results/to_export/simulation_results.csv
  feature_names_path: configs/data_generation_feature_names.yaml
  use_registry_feature_allowlist: true
  registry_feature_groups: [x_op, x_cont, x_sched]
  # Match the optimization-ready surrogate contract:
  # keep schema-defined x_op/x_cont/x_sched inputs, but exclude x0__ states.
  drop_metadata_fields: true
  drop_diagnostic_fields: true
  drop_unused_y_fields: true
  drop_cols: [line_name, plotter_csv]
  drop_prefixes: [x0__]
  ignore_missing_drop_cols: true
  target_cols: [rocof_COI, dev_COI, Delta_P_IBR_1, Delta_P_IBR_2, Delta_P_IBR_3, Delta_P_IBR_4]
  use_recommended_scalers: false

split:
  test_size: 0.3
  val_fraction: 0.5
  random_state: 42

training:
  epochs: 1000
  lr: 0.001
  weight_decay: 0.0001
  batch_train: 512
  batch_eval: 1024
  loss_weights: []
  use_lr_scheduler: true
  lr_scheduler_patience: 8
  lr_scheduler_factor: 0.5
  lr_scheduler_min_lr: 1e-7

sweep:
  models: [MTLSH]
  losses: [mse]
  scalers: [standard, minmax, robust, log1p]
  seeds: [42]
  model: {}
  training: {}
  data: {}
