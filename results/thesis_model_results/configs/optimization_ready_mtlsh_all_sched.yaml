output_dir: results/thesis_model_results/outputs/optimization_ready_mtlsh_all_sched
skip_if_exists: false
seed: 42

model:
  # Small MTLSH variant sized for optimization embedding.
  shared_sizes: [32]
  head_sizes: [16]
  activation: relu
  dropout: 0.0

data:
  csv_path: results/thesis_data_generation_results/results/simulation_results.csv
  feature_names_path: configs/data_generation_feature_names.yaml
  use_registry_feature_allowlist: true
  registry_feature_groups: [x_op, x_cont, x_sched]
  # Keep the full schema-defined x_sched contract for the full optimization-ready
  # MTLSH variant: M_i, D_i, M_agg, D_agg, dispatch totals/share, dispatch levels,
  # and individual reserve schedule features.
  drop_metadata_fields: true
  drop_diagnostic_fields: true
  drop_unused_y_fields: true
  drop_cols: [line_name, plotter_csv, reserve_p_genrou, reserve_p_ibr, reserve_q_genrou, reserve_q_ibr]
  drop_prefixes: [x0__]
  ignore_missing_drop_cols: true
  target_cols:
    - rocof_COI
    - dev_COI
    - Delta_P_IBR_1
    - Delta_P_IBR_2
    - Delta_P_IBR_3
    - Delta_P_IBR_4
  use_recommended_scalers: false

split:
  test_size: 0.3
  val_fraction: 0.5
  random_state: 42

training:
  epochs: 700
  lr: 0.001
  weight_decay: 0.0001
  batch_train: 512
  batch_eval: 1024
  loss_weights: []
  use_lr_scheduler: true
  lr_scheduler_patience: 8
  lr_scheduler_factor: 0.5
  lr_scheduler_min_lr: 1e-7
  save_test_predictions: true

sweep:
  models: [MTLSH]
  losses: [kendall]
  scalers: [minmax]
  seeds: [42]
  model: {}
  training: {}
  data: {}
