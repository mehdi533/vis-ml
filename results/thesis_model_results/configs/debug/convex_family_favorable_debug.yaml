output_dir: results/thesis_model_results/debug_outputs/convex_family_favorable
skip_if_exists: false
seed: 42

model:
  hidden_sizes: [128, 64]
  shared_sizes: [128, 64]
  head_sizes: [64, 32]
  activation: relu
  dropout: 0.0
  u_feature_spec:
    scalar_fields: [M_agg, D_agg, P_GENROU_TOTAL, P_REGCV1_TOTAL, P_DISPATCH_TOTAL, P_REGCV1_SHARE]
    prefixes:
      - {name: M}
      - {name: D}
      - {name: p_genrou}
      - {name: p_regcv1}
      - {name: p_genrou_reserve}
      - {name: p_regcv1_reserve}

data:
  csv_path: __simpqareas/exaple_40_samples.csv
  feature_names_path: configs/data_generation_feature_names.yaml
  use_registry_feature_allowlist: true
  drop_metadata_fields: true
  drop_diagnostic_fields: true
  target_cols: [rocof_COI, dev_COI, Delta_P_IBR_1, Delta_P_IBR_2, Delta_P_IBR_3, Delta_P_IBR_4]
  drop_cols:
    - line_name
    - plotter_csv
    - reserve_p_genrou
    - reserve_p_ibr
    - reserve_q_genrou
    - reserve_q_ibr
  drop_prefixes: [Delta_P_IBR_abs_, bus_freq_max_abs_dev_, bus_v_max_abs_dev_]
  ignore_missing_drop_cols: true
  use_recommended_scalers: false

split:
  test_size: 0.3
  val_fraction: 0.5
  random_state: 42

training:
  epochs: 5
  lr: 0.001
  weight_decay: 0.0001
  batch_train: 8
  batch_eval: 8
  loss_weights: []
  use_lr_scheduler: true
  lr_scheduler_patience: 2
  lr_scheduler_factor: 0.5
  lr_scheduler_min_lr: 1e-7

sweep:
  models: [FICNN, PICNN, PICNN_MTLSH]
  losses: [mse]
  scalers: [minmax]
  seeds: [42]
  model: {}
  training: {}
  data: {}
