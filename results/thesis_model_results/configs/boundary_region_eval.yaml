output_dir: results/thesis_model_results/outputs/boundary_region_eval
source_sweep_dir: results/thesis_model_results/outputs/shortlist_detailed_eval

data:
  csv_path: results/to_export/simulation_results.csv
  feature_names_path: configs/data_generation_feature_names.yaml
  use_registry_feature_allowlist: true
  drop_metadata_fields: true
  drop_diagnostic_fields: true
  target_cols: [rocof_COI, dev_COI, Delta_P_IBR_1, Delta_P_IBR_2, Delta_P_IBR_3, Delta_P_IBR_4]
  drop_cols:
    - line_name
    - plotter_csv
  drop_prefixes: []
  ignore_missing_drop_cols: true
  use_recommended_scalers: false

split:
  test_size: 0.3
  val_fraction: 0.5
  random_state: 42

regions:
  input_quantiles:
    - name: low_inertia_edge
      column: M_agg
      quantile: 0.1
      op: le
    - name: high_damping_edge
      column: D_agg
      quantile: 0.9
      op: ge
    - name: high_disturbance
      column: DELTA_PQ_tot
      quantile: 0.9
      op: ge
    - name: high_loading
      column: system_max_loading_prefault
      quantile: 0.9
      op: ge
  target_quantiles:
    - name: severe_rocof_tail
      column: rocof_COI
      quantile: 0.9
      op: ge
      use_abs: true
    - name: severe_dev_tail
      column: dev_COI
      quantile: 0.9
      op: ge
      use_abs: true
