output_dir: results/thesis_model_results/outputs/optimization_ready_mtlsh_kan_equivalent
skip_if_exists: false
seed: 42

model:
  # MTLSH-equivalent KAN setup:
  # - KAN shared trunk
  # - no extra grouped shared blocks
  # - standard MLP heads
  shared_sizes: [32]
  head_sizes: [16]
  group_head_indices: []
  dropout: 0.0
  kan_grid_size: 8
  kan_grid_min: -1.0
  kan_grid_max: 1.0

data:
  csv_path: results/to_export/simulation_results.csv
  feature_names_path: configs/data_generation_feature_names.yaml
  use_registry_feature_allowlist: true
  registry_feature_groups: [x_op, x_cont, x_sched]
  registry_group_overrides:
    x_sched:
      drop_fields: [M_agg, D_agg, P_GENROU_TOTAL, P_REGCV1_TOTAL, P_DISPATCH_TOTAL, P_REGCV1_SHARE]
      keep_prefix_keys: [M, D]
  drop_metadata_fields: true
  drop_diagnostic_fields: true
  drop_unused_y_fields: true
  drop_cols: [line_name, plotter_csv, M_agg, D_agg]
  drop_prefixes: [x0__]
  ignore_missing_drop_cols: true
  target_cols:
    - rocof_COI
    - dev_COI
    - Delta_P_IBR_1
    - Delta_P_IBR_2
    - Delta_P_IBR_3
    - Delta_P_IBR_4
  use_recommended_scalers: false

split:
  test_size: 0.3
  val_fraction: 0.5
  random_state: 42

training:
  epochs: 80
  lr: 0.001
  weight_decay: 0.0001
  batch_train: 1024
  batch_eval: 2048
  loss_weights: []
  use_lr_scheduler: true
  lr_scheduler_patience: 4
  lr_scheduler_factor: 0.5
  lr_scheduler_min_lr: 1e-6
  save_test_predictions: true

sweep:
  models: [MTLGSH_KAN_SHARED]
  losses: [mse]
  scalers: [minmax]
  seeds: [42]
  model: {}
  training: {}
  data: {}
