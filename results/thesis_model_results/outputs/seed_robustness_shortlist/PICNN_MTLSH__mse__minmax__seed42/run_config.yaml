      index: 1
    - kind: prefixed
      name: D
      index: 1
    - kind: prefixed
      name: M
      index: 2
    - kind: prefixed
      name: D
      index: 2
    - kind: prefixed
      name: M
      index: 3
    - kind: prefixed
      name: D
      index: 3
