  - 256
  - 128
  - 64
  shared_sizes:
  - 256
  - 128
  group_shared_sizes:
  - 128
  - 64
  head_sizes:
  - 64
  group_head_indices:
  - - 0
    - 1
  - - 2
    - 3
    - 4
    - 5
  activation: relu
  dropout: 0.0
  u_feature_spec:
    items:
    - kind: prefixed
      name: M
      index: 1
    - kind: prefixed
      name: D
      index: 1
    - kind: prefixed
      name: M
      index: 2
    - kind: prefixed
