    - kind: scalar
      field: D_agg
    - kind: scalar
      field: P_REGCV1_TOTAL
    - kind: scalar
      field: P_DISPATCH_TOTAL
    - kind: scalar
      field: P_REGCV1_SHARE
data:
  csv_path: tmp/__simpqareas/exaple_40_samples.csv
  feature_names_path: configs/data_generation_feature_names.yaml
  use_registry_feature_allowlist: true
  drop_metadata_fields: true
  drop_diagnostic_fields: true
  target_cols:
