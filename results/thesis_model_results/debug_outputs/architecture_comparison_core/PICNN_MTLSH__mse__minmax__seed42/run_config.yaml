  val_fraction: 0.5
  random_state: 42
training:
  epochs: 5
  lr: 0.001
  weight_decay: 0.0001
  batch_train: 8
  batch_eval: 8
  loss_weights: []
  use_lr_scheduler: true
  lr_scheduler_patience: 2
  lr_scheduler_factor: 0.5
  lr_scheduler_min_lr: 1e-7
