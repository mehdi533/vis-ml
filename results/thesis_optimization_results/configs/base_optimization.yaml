formulation:
  id: base
  name: Base
  description: Base optimization config used for thesis Chapter 5 optimization experiments.
  equation_map:
    objective_dispatch: "Eq. (4.17)"
    ed_balance_limits: "Eq. (2.19b)-(2.19d)"
    base_line_flow: "Eq. (2.20), (2.19e)"
    preventive_n1: "Eq. (4.18)-(4.19)"
    surrogate_embedding_relu_milp: "Eq. (2.26)-(2.27)"

system:
  case: data_generation/andes_cases/ieee39_full_ibrs.xlsx
  frequency_hz: 50.0

scenario:
  base_scale: 0.6
  step_scale: 1.2
  load_step_time: 1.0

seed:
  M: 4.0
  D: 2.0

model:
  # This must point to an optimization-ready surrogate artifact bundle.
  type: MTLSH
  model_dir: results/thesis_model_results/outputs/optimization_ready_mtlsh/MTLSH__kendall__minmax__seed42
  retain_reason: "Retained surrogate: MTLSH with M_i, D_i, M_agg, D_agg only."
  in_dim: 178
  n_tasks: 6
  shared_sizes: [32]
  head_sizes: [16]
  dropout: 0.0
  convex: false

features:
  # Strict policy: build all surrogate inputs from the current system state only.
  strict_from_system: true
  contingency_mode: load_mismatch
  # For line-contingency embedding runs, set:
  # contingency_mode: line
  # contingency_line_uid: <line_uid>
  # Resolve optimization x_features directly from the retained model bundle so
  # the optimizer uses the exact exported training contract.
  x_features_from_registry: false
  x_features_from_model_dir: true
  feature_names_path: configs/data_generation_feature_names.yaml
  registry_feature_groups: ["x_op", "x_cont", "x_sched"]
  exclude_prefixes: ["x0__"]
  registry_filter_to_buildable: true
  registry_align_to_model_contract: true
  registry_include_unbuildable_model_features: false
  missing_feature_source: none
  fixed_source_override_non_sched: false
  allow_missing_features: false
  allow_constant_fill_for_unresolved_missing: false
  missing_fill_value: 0.0

outputs:
  y_names: ["rocof_COI", "dev_COI", "Delta_P_IBR_1", "Delta_P_IBR_2", "Delta_P_IBR_3", "Delta_P_IBR_4"]

ibr:
  indices: [0, 5, 7, 8]

bounds:
  M_bounds: [0, 8.0]
  D_bounds: [0, 6.0]
  y_min: [-1, -0.8, -5.0, -5.0, -5.0, -5.0]
  y_max: [1, 0.8, 5.0, 5.0, 5.0, 5.0]

constraints:
  use_input: true
  use_output: true
  use_nn: true
  use_line: true
  use_n1: true
  use_n1_redispatch: false
  exclude_islanding_critical_n1: true
  use_ed: true
  nn_mode: milp
  y_ibr_idx: [2, 3, 4, 5]
  enforce_dispatch_output_link: true

ed_costs:
  cost_table_path: configs/table_3_1_dispatch_costs.yaml

solver:
  name: GUROBI
  verbose: true
  reoptimize: true
  feasibility_checks: true
  extra_kwargs:
    TimeLimit: 1200
    MIPGap: 1.0e-3

plots:
  enabled: false
  dir: results/thesis_optimization_results/results/plots
  m_d: false
  pred_vs_opt: false
  dispatch: false
  network: false
  network_layout: kamada

output:
  results_dir: results/thesis_optimization_results/results/formulations
  run_tag: base
  log_file: results/thesis_optimization_results/results/formulations/base/base.log
  fail_on_infeasible: false
