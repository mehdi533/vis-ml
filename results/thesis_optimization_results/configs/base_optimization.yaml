formulation:
  id: base
  name: Base
  description: Base optimization config used for thesis Chapter 5 optimization experiments.
  equation_map:
    objective_dispatch: "Eq. (4.17)"
    ed_balance_limits: "Eq. (2.19b)-(2.19d)"
    base_line_flow: "Eq. (2.20), (2.19e)"
    preventive_n1: "Eq. (4.18)-(4.19)"
    surrogate_embedding_relu_milp: "Eq. (2.26)-(2.27)"
    surrogate_embedding_icnn_picnn_epigraph: "Eq. (4.21)-(4.22)"

system:
  case: data_generation/andes_cases/ieee39_full_ibrs.xlsx
  frequency_hz: 50.0

scenario:
  base_scale: 0.6
  step_scale: 1.2
  load_step_time: 3.0

seed:
  M: 4.0
  D: 2.0

model:
  # This must point to an optimization-ready surrogate artifact bundle.
  # The full thesis shortlist models under results/thesis_model_results/... are trained on
  # 1206 inputs, including ~998 x0__ initial-state channels and line-contingency fields.
  # Those are not directly buildable by the current scheduling optimizer.
  type: MTLSharedHeads
  model_dir: __simpqareas/MTLSH__mse__minmax__seed42
  retain_reason: "Retained surrogate: best accuracy/complexity compromise among embeddable candidates."
  in_dim: 46
  n_tasks: 6
  shared_sizes: [32]
  head_sizes: [16]
  dropout: 0.0
  convex: true

features:
  # This list is the optimizer-buildable surrogate contract, not a dump of every dataset column.
  # If you retrain the optimization surrogate, replace this with the exact training feature order
  # for that optimization-ready model.
  x_features: ["base_load_scale","load_step_scale","base_load_p_total","base_load_q_total","DELTA_PQ_tot","M_1","D_1","M_2","D_2","M_3","D_3","M_4","D_4","DELTA_P_PQ_1","DELTA_P_PQ_2","DELTA_P_PQ_3","DELTA_P_PQ_4","DELTA_P_PQ_5","DELTA_P_PQ_6","DELTA_P_PQ_7","DELTA_P_PQ_8","DELTA_P_PQ_9","DELTA_P_PQ_10","DELTA_P_PQ_11","DELTA_P_PQ_12","DELTA_P_PQ_13","DELTA_P_PQ_14","DELTA_P_PQ_15","DELTA_P_PQ_16","DELTA_P_PQ_17","DELTA_P_PQ_18","DELTA_P_PQ_19","DELTA_P_OWNER_1","DELTA_P_OWNER_2","DELTA_P_OWNER_3","DELTA_P_OWNER_4","P_GENROU_1","P_GENROU_2","P_GENROU_3","P_GENROU_4","P_GENROU_5","P_GENROU_6","P_REGCV1_1","P_REGCV1_2","P_REGCV1_3","P_REGCV1_4"]
  allow_missing_features: false
  missing_fill_value: 0.0

outputs:
  y_names: ["rocof_COI", "dev_COI", "Delta_P_IBR_1", "Delta_P_IBR_2", "Delta_P_IBR_3", "Delta_P_IBR_4"]

ibr:
  indices: [0, 5, 7, 8]

bounds:
  M_bounds: [2.0, 8.0]
  D_bounds: [0.0, 6.0]
  y_min: [-0.5, -0.5, -5.0, -5.0, -5.0, -5.0]
  y_max: [0.5, 0.5, 5.0, 5.0, 5.0, 5.0]

constraints:
  use_input: true
  use_output: true
  use_nn: true
  use_line: true
  use_n1: true
  use_n1_redispatch: false
  exclude_islanding_critical_n1: true
  use_ed: true
  nn_mode: milp
  y_ibr_idx: [2, 3, 4, 5]
  enforce_dispatch_output_link: true
  epigraph_tie_breaker: 1.0e-6

ed_costs:
  a: [1.0, 10.0, 10.0, 10.0, 10.0, 1.0, 10.0, 1.0, 1.0, 10.0]
  b: [0.5, 5.0, 5.0, 5.0, 5.0, 0.5, 5.0, 0.5, 0.5, 5.0]
  c: [0.01, 0.2, 0.2, 0.2, 0.2, 0.01, 0.2, 0.01, 0.01, 0.2]

solver:
  name: GUROBI
  verbose: false
  reoptimize: true
  feasibility_checks: false
  extra_kwargs:
    TimeLimit: 1200
    MIPGap: 1.0e-3

plots:
  enabled: false
  dir: results/thesis_optimization_results/results/plots
  m_d: false
  pred_vs_opt: false
  dispatch: false
  network: false
  network_layout: kamada

output:
  results_dir: results/thesis_optimization_results/results/formulations
  run_tag: base
  log_file: results/thesis_optimization_results/results/formulations/base/base.log
  fail_on_infeasible: false
