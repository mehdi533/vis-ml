benchmark_name: chapter5_structured_optimization_benchmark
retained_formulation_id: ed_line_n1_surrogate

main_formulation_ids:
  - ed_line_n1_surrogate

cross_method_formulation_ids:
  - ed
  - ed_line
  - ed_line_n1
  - ed_surrogate
  - ed_line_n1_surrogate
  - ed_line_n1_surrogate_redispatch

global_load_mismatch:
  base_scales: [0.60, 0.75, 0.90, 1.00]
  step_scales: [0.80, 0.97, 1.03, 1.07, 1.20]

zone_mismatch:
  base_scales: [0.60, 0.75, 0.90, 1.00]
  step_scales: [0.97, 1.03, 1.08]
  zone_suite_config: suites/04_zone_mismatch_vis_sensitivity.yaml

line_outage:
  n_screened_outages: 10
  exclude_line_uids: [21,34,35,36,39,40,41,42,43,44,45]
  base_scales: [0.60, 0.80, 1.00]
  severity_bins: 5
  severity_proxy:
    source_csv: results/thesis_data_generation_results/results/line_outages_only/simulation_results.csv
    weights:
      pre_fault_loading: 0.40
      ptdf_l1_norm_outaged_line: 0.35
      max_abs_lodf_row: 0.25

results:
  main_results_root: results/thesis_optimization_results/results/benchmark/main
  cross_results_root: results/thesis_optimization_results/results/benchmark/cross_method_subset
  replay_main_results_root: results/thesis_optimization_results/results/benchmark/replay/main
  replay_cross_results_root: results/thesis_optimization_results/results/benchmark/replay/cross_method_subset
