name: chapter5_optimization_formulation_comparison
baseline_id: ed

results_root: ../../results/formulations

# Optional future scenario expansion:
# scenarios:
#   - id: chapter5_nominal
#     name: Chapter 5 nominal load-step case
#     overrides:
#       scenario:
#         base_scale: 0.6
#         step_scale: 1.2
#         load_step_time: 3.0
#
# Optional thesis-relevant embedding-mode sensitivities can be added by cloning a
# surrogate run and overriding `constraints.nn_mode` to `fixed_pattern` or
# `milp` where that comparison is part of the final chapter narrative.

output:
  summary_csv: ../../results/formulation_comparison_summary.csv
  summary_markdown: ../../results/formulation_comparison_summary.md
  summary_json: ../../results/formulation_comparison_summary.json

runs:
  - id: ed
    name: ED
    description: Economic dispatch only.
    base_config: ../base_optimization.yaml
    overrides:
      solver:
        extra_kwargs:
          TimeLimit: 600
      constraints:
        use_input: false
        use_output: false
        use_nn: false
        use_line: false
        use_n1: false
        use_n1_redispatch: false
        use_ed: true

  - id: ed_line
    name: ED + Line
    description: Economic dispatch with base-case PTDF line limits.
    base_config: ../base_optimization.yaml
    overrides:
      solver:
        extra_kwargs:
          TimeLimit: 600
      constraints:
        use_input: false
        use_output: false
        use_nn: false
        use_line: true
        use_n1: false
        use_n1_redispatch: false
        use_ed: true

  - id: ed_line_n1
    name: ED + Line + N-1
    description: Preventive N-1 line-security constraints (LODF), no surrogate.
    base_config: ../base_optimization.yaml
    overrides:
      solver:
        extra_kwargs:
          TimeLimit: 600
      constraints:
        use_input: false
        use_output: false
        use_nn: false
        use_line: true
        use_n1: true
        use_n1_redispatch: false
        use_ed: true

  - id: ed_surrogate
    name: ED + Surrogate
    description: Dynamic-security surrogate embedded, without PTDF/N-1 line constraints.
    base_config: ../base_optimization.yaml
    overrides:
      solver:
        extra_kwargs:
          TimeLimit: 3600
      constraints:
        use_input: true
        use_output: true
        use_nn: true
        use_line: false
        use_n1: false
        use_n1_redispatch: false
        use_ed: true
        nn_mode: milp
        enforce_dispatch_output_link: false

  - id: ed_line_n1_surrogate
    name: ED + Line + N-1 + Surrogate
    description: Full preventive formulation used as main thesis baseline.
    base_config: ../base_optimization.yaml
    overrides:
      solver:
        extra_kwargs:
          TimeLimit: 3600
      constraints:
        use_input: true
        use_output: true
        use_nn: true
        use_line: true
        use_n1: true
        use_n1_redispatch: false
        use_ed: true
        nn_mode: milp
        enforce_dispatch_output_link: false

  - id: ed_line_n1_surrogate_redispatch
    name: ED + Line + N-1 + Surrogate + Redispatch
    description: Optional sensitivity with N-1 redispatch recourse approximation.
    base_config: ../base_optimization.yaml
    overrides:
      solver:
        extra_kwargs:
          TimeLimit: 3600
      constraints:
        use_input: true
        use_output: true
        use_nn: true
        use_line: true
        use_n1: true
        use_n1_redispatch: true
        use_ed: true
        nn_mode: milp
        enforce_dispatch_output_link: false
