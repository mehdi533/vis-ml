name: chapter5_optimization_milp_constraint_isolation_local
baseline_id: ed_debug

results_root: ../../local_validation/milp_isolation_local/formulations

output:
  summary_csv: ../../local_validation/milp_isolation_local/milp_constraint_isolation_local_summary.csv
  summary_markdown: ../../local_validation/milp_isolation_local/milp_constraint_isolation_local_summary.md
  summary_json: ../../local_validation/milp_isolation_local/milp_constraint_isolation_local_summary.json

runs:
  - id: ed_debug
    name: ED Baseline (MILP Isolation Local)
    description: Pure dispatch baseline used to compare MILP surrogate debug runs.
    base_config: ../base_optimization.yaml
    overrides:
      solver:
        name: GUROBI
        verbose: false
        reoptimize: false
        feasibility_checks: true
        extra_kwargs:
          TimeLimit: 60
          MIPGap: 0.001
      constraints:
        use_input: false
        use_output: false
        use_nn: false
        use_line: false
        use_n1: false
        use_n1_redispatch: false
        use_ed: true

  - id: milp_shared_only
    name: MILP Shared Trunk Only
    description: Check whether the shared MTLSH MILP trunk is feasible before any output head is attached.
    base_config: ../base_optimization.yaml
    overrides:
      solver:
        name: GUROBI
        verbose: false
        reoptimize: false
        feasibility_checks: true
        extra_kwargs:
          TimeLimit: 120
          MIPGap: 0.001
      constraints:
        use_input: true
        use_output: false
        use_nn: true
        use_line: false
        use_n1: false
        use_n1_redispatch: false
        use_ed: true
        nn_mode: milp
        nn_active_output_idx: []
        nn_enabled_subblocks: [nn_shared]

  - id: surrogate_feature_constraints_only
    name: Surrogate Debug Feature Constraints Only
    description: Only the optimization feature-contract constraints are active; NN and output blocks are off.
    base_config: ../base_optimization.yaml
    overrides:
      solver:
        name: GUROBI
        verbose: false
        reoptimize: false
        feasibility_checks: true
        extra_kwargs:
          TimeLimit: 120
          MIPGap: 0.001
      constraints:
        use_input: true
        use_output: false
        use_nn: false
        use_line: false
        use_n1: false
        use_n1_redispatch: false
        use_ed: true

  - id: surrogate_output_constraints_only
    name: Surrogate Debug Output Constraints Only
    description: Activate feature constraints and raw surrogate-output bounds only; no NN embedding.
    base_config: ../base_optimization.yaml
    overrides:
      solver:
        name: GUROBI
        verbose: false
        reoptimize: false
        feasibility_checks: true
        extra_kwargs:
          TimeLimit: 120
          MIPGap: 0.001
      constraints:
        use_input: true
        use_output: true
        use_nn: false
        use_line: false
        use_n1: false
        use_n1_redispatch: false
        use_ed: true
        enforce_dispatch_output_link: false
        output_active_idx: [0, 1, 2, 3, 4, 5]

  - id: surrogate_layers_only
    name: Surrogate Debug Layers Only
    description: Activate feature constraints and the MILP network layers only, without surrogate-output bounds.
    base_config: ../base_optimization.yaml
    overrides:
      solver:
        name: GUROBI
        verbose: false
        reoptimize: false
        feasibility_checks: true
        extra_kwargs:
          TimeLimit: 120
          MIPGap: 0.001
      constraints:
        use_input: true
        use_output: false
        use_nn: true
        use_line: false
        use_n1: false
        use_n1_redispatch: false
        use_ed: true
        nn_mode: milp
        nn_active_output_idx: [0, 1, 2, 3, 4, 5]
        nn_enabled_subblocks:
          - nn_shared
          - nn_head_0
          - nn_head_1
          - nn_head_2
          - nn_head_3
          - nn_head_4
          - nn_head_5

  - id: milp_freq_heads
    name: MILP Frequency Heads
    description: Shared trunk plus the RoCoF and COI frequency-deviation heads only.
    base_config: ../base_optimization.yaml
    overrides:
      solver:
        name: GUROBI
        verbose: false
        reoptimize: false
        feasibility_checks: true
        extra_kwargs:
          TimeLimit: 120
          MIPGap: 0.001
      constraints:
        use_input: true
        use_output: true
        use_nn: true
        use_line: false
        use_n1: false
        use_n1_redispatch: false
        use_ed: true
        nn_mode: milp
        enforce_dispatch_output_link: false
        nn_active_output_idx: [0, 1]
        output_active_idx: [0, 1]
        nn_enabled_subblocks: [nn_shared, nn_head_0, nn_head_1, nn_link_0, nn_link_1]

  - id: milp_dp1_head
    name: MILP Delta P Head 1
    description: Shared trunk plus only the first IBR Delta P head, with output bounds only.
    base_config: ../base_optimization.yaml
    overrides:
      solver:
        name: GUROBI
        verbose: false
        reoptimize: false
        feasibility_checks: true
        extra_kwargs:
          TimeLimit: 120
          MIPGap: 0.001
      constraints:
        use_input: true
        use_output: true
        use_nn: true
        use_line: false
        use_n1: false
        use_n1_redispatch: false
        use_ed: true
        nn_mode: milp
        enforce_dispatch_output_link: false
        nn_active_output_idx: [2]
        output_active_idx: [2]
        nn_enabled_subblocks: [nn_shared, nn_head_2, nn_link_2]

  - id: milp_dp2_head
    name: MILP Delta P Head 2
    description: Shared trunk plus only the second IBR Delta P head, with output bounds only.
    base_config: ../base_optimization.yaml
    overrides:
      solver:
        name: GUROBI
        verbose: false
        reoptimize: false
        feasibility_checks: true
        extra_kwargs:
          TimeLimit: 120
          MIPGap: 0.001
      constraints:
        use_input: true
        use_output: true
        use_nn: true
        use_line: false
        use_n1: false
        use_n1_redispatch: false
        use_ed: true
        nn_mode: milp
        enforce_dispatch_output_link: false
        nn_active_output_idx: [3]
        output_active_idx: [3]
        nn_enabled_subblocks: [nn_shared, nn_head_3, nn_link_3]

  - id: milp_dp3_head
    name: MILP Delta P Head 3
    description: Shared trunk plus only the third IBR Delta P head, with output bounds only.
    base_config: ../base_optimization.yaml
    overrides:
      solver:
        name: GUROBI
        verbose: false
        reoptimize: false
        feasibility_checks: true
        extra_kwargs:
          TimeLimit: 120
          MIPGap: 0.001
      constraints:
        use_input: true
        use_output: true
        use_nn: true
        use_line: false
        use_n1: false
        use_n1_redispatch: false
        use_ed: true
        nn_mode: milp
        enforce_dispatch_output_link: false
        nn_active_output_idx: [4]
        output_active_idx: [4]
        nn_enabled_subblocks: [nn_shared, nn_head_4, nn_link_4]

  - id: milp_dp4_head
    name: MILP Delta P Head 4
    description: Shared trunk plus only the fourth IBR Delta P head, with output bounds only.
    base_config: ../base_optimization.yaml
    overrides:
      solver:
        name: GUROBI
        verbose: false
        reoptimize: false
        feasibility_checks: true
        extra_kwargs:
          TimeLimit: 120
          MIPGap: 0.001
      constraints:
        use_input: true
        use_output: true
        use_nn: true
        use_line: false
        use_n1: false
        use_n1_redispatch: false
        use_ed: true
        nn_mode: milp
        enforce_dispatch_output_link: false
        nn_active_output_idx: [5]
        output_active_idx: [5]
        nn_enabled_subblocks: [nn_shared, nn_head_5, nn_link_5]

  - id: milp_all_outputs_no_dispatch_link
    name: MILP All Outputs Without Dispatch Link
    description: Full MILP surrogate with all six outputs active, but no reserve-to-Delta P coupling.
    base_config: ../base_optimization.yaml
    overrides:
      solver:
        name: GUROBI
        verbose: false
        reoptimize: false
        feasibility_checks: true
        extra_kwargs:
          TimeLimit: 180
          MIPGap: 0.001
      constraints:
        use_input: true
        use_output: true
        use_nn: true
        use_line: false
        use_n1: false
        use_n1_redispatch: false
        use_ed: true
        nn_mode: milp
        enforce_dispatch_output_link: false
        nn_active_output_idx: [0, 1, 2, 3, 4, 5]
        output_active_idx: [0, 1, 2, 3, 4, 5]
        nn_enabled_subblocks:
          - nn_shared
          - nn_head_0
          - nn_head_1
          - nn_head_2
          - nn_head_3
          - nn_head_4
          - nn_head_5
          - nn_link_0
          - nn_link_1
          - nn_link_2
          - nn_link_3
          - nn_link_4
          - nn_link_5
