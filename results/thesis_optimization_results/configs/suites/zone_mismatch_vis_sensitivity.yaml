name: chapter5_zone_mismatch_vis_sensitivity
baseline_id: retained_vis

results_root: ../../results/zone_mismatch_vis_sensitivity_formulations

output:
  summary_csv: ../../results/zone_mismatch_vis_sensitivity_summary.csv
  summary_markdown: ../../results/zone_mismatch_vis_sensitivity_summary.md
  summary_json: ../../results/zone_mismatch_vis_sensitivity_summary.json

scenarios:
  - id: global_uniform
    name: Global uniform mismatch
    description: Uniform load increase across all PQ loads.
    overrides:
      scenario:
        step_scale: 1.2

  - id: zone_owner_1
    name: Zone-based mismatch in owner 1
    description: Load step applied only to PQ loads in owner/zone bucket 1.
    overrides:
      scenario:
        step_scale: 1.2
        load_step_target_owners: ["1"]

  - id: zone_owner_2
    name: Zone-based mismatch in owner 2
    description: Load step applied only to PQ loads in owner/zone bucket 2.
    overrides:
      scenario:
        step_scale: 1.2
        load_step_target_owners: ["2"]

  - id: zone_owner_3
    name: Zone-based mismatch in owner 3
    description: Load step applied only to PQ loads in owner/zone bucket 3.
    overrides:
      scenario:
        step_scale: 1.2
        load_step_target_owners: ["3"]

  - id: zone_owner_4
    name: Zone-based mismatch in owner 4
    description: Load step applied only to PQ loads in owner/zone bucket 4.
    overrides:
      scenario:
        step_scale: 1.2
        load_step_target_owners: ["4"]

runs:
  - id: retained_vis
    comparison_family: zone_mismatch_vis
    name: Retained VIS formulation
    description: Final retained preventive formulation with surrogate, line, and N-1 constraints.
    base_config: ../base_optimization.yaml
    overrides:
      solver:
        extra_kwargs:
          TimeLimit: 3600
      constraints:
        nn_mode: milp
        enforce_dispatch_output_link: false

  - id: retained_vis_area_tied
    comparison_family: zone_mismatch_vis
    name: Retained VIS formulation (area-tied M/D)
    description: Final retained preventive formulation with M and D tied within each area.
    base_config: ../base_optimization.yaml
    overrides:
      solver:
        extra_kwargs:
          TimeLimit: 3600
      constraints:
        nn_mode: milp
        enforce_dispatch_output_link: false
        vis_tie_groups:
          - [0, 2]  # WEST: REGCV1_1, REGCV1_3
          - [1, 3]  # EAST: REGCV1_2, REGCV1_4
