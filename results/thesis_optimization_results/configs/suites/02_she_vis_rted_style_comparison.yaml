name: chapter5_she_vis_rted_style_comparison
baseline_id: she_method_i_rted

results_root: ../../results/she_style_formulations

output:
  summary_csv: ../../results/she_style_comparison_summary.csv
  summary_markdown: ../../results/she_style_comparison_summary.md
  summary_json: ../../results/she_style_comparison_summary.json

runs:
  - id: she_method_i_rted
    paper_method: Method I
    comparison_family: she_vis_rted_style
    name: Method I - ED / RTED
    description: ED baseline without dynamic-security surrogate constraints.
    base_config: ../base_optimization.yaml
    overrides:
      solver:
        extra_kwargs:
          TimeLimit: 600
      constraints:
        use_input: false
        use_output: false
        use_nn: false
        use_line: false
        use_n1: false
        use_n1_redispatch: false
        use_ed: true

  - id: she_method_ii_dyn_fixed_md_no_reserve
    paper_method: Method II
    comparison_family: she_vis_rted_style
    name: Method II - Dynamic Constraints, Fixed M/D, No Reserve Link
    description: Surrogate dynamic constraints with fixed M and D, without Delta-P dispatch coupling.
    base_config: ../base_optimization.yaml
    overrides:
      solver:
        extra_kwargs:
          TimeLimit: 3600
      bounds:
        M_bounds: [4.0, 4.0]
        D_bounds: [2.0, 2.0]
      constraints:
        use_input: true
        use_output: true
        use_nn: true
        use_line: false
        use_n1: false
        use_n1_redispatch: false
        use_ed: true
        nn_mode: milp
        enforce_dispatch_output_link: false

  - id: she_method_iii_dyn_fixed_md_with_reserve
    paper_method: Method III
    comparison_family: she_vis_rted_style
    name: Method III - Dynamic Constraints, Fixed M/D, With Reserve Link
    description: Surrogate dynamic constraints with fixed M and D and Delta-P dispatch coupling.
    base_config: ../base_optimization.yaml
    overrides:
      solver:
        extra_kwargs:
          TimeLimit: 3600
      bounds:
        M_bounds: [4.0, 4.0]
        D_bounds: [2.0, 2.0]
      constraints:
        use_input: true
        use_output: true
        use_nn: true
        use_line: false
        use_n1: false
        use_n1_redispatch: false
        use_ed: true
        nn_mode: milp
        enforce_dispatch_output_link: true

  - id: she_method_iv_vis_rted_full
    paper_method: Method IV
    comparison_family: she_vis_rted_style
    name: Method IV - VIS-RTED (Optimized M/D + Reserve Link)
    description: Surrogate dynamic constraints with optimized M and D and Delta-P dispatch coupling.
    base_config: ../base_optimization.yaml
    overrides:
      solver:
        extra_kwargs:
          TimeLimit: 3600
      bounds:
        M_bounds: [2.0, 8.0]
        D_bounds: [0.0, 6.0]
      constraints:
        use_input: true
        use_output: true
        use_nn: true
        use_line: false
        use_n1: false
        use_n1_redispatch: false
        use_ed: true
        nn_mode: milp
        enforce_dispatch_output_link: true
