name: chapter5_security_checks_smoke
baseline_id: ed_line_n1_surrogate

results_root: ../../local_validation/smoke/security_checks/formulations

output:
  summary_csv: ../../local_validation/smoke/security_checks_smoke_summary.csv
  summary_markdown: ../../local_validation/smoke/security_checks_smoke_summary.md
  summary_json: ../../local_validation/smoke/security_checks_smoke_summary.json

runs:
  - id: ed_line_n1_surrogate
    name: ED + Line + N-1 + Surrogate
    description: Smoke security-check run for the retained preventive formulation.
    base_config: ../base_optimization.yaml
    overrides:
      solver:
        extra_kwargs:
          TimeLimit: 300
      constraints:
        use_input: true
        use_output: true
        use_nn: true
        use_line: true
        use_n1: true
        use_n1_redispatch: false
        use_ed: true
        nn_mode: milp
        enforce_dispatch_output_link: false
