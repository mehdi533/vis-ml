name: chapter5_she_vis_rted_style_comparison_smoke
baseline_id: she_method_i_rted

results_root: ../../local_validation/smoke/she_style_formulations

output:
  summary_csv: ../../local_validation/smoke/she_style_comparison_smoke_summary.csv
  summary_markdown: ../../local_validation/smoke/she_style_comparison_smoke_summary.md
  summary_json: ../../local_validation/smoke/she_style_comparison_smoke_summary.json

runs:
  - id: she_method_i_rted
    paper_method: Method I
    comparison_family: she_vis_rted_style_smoke
    name: Method I - ED / RTED
    description: Smoke ED baseline for the She-style comparison.
    base_config: ../base_optimization.yaml
    overrides:
      solver:
        extra_kwargs:
          TimeLimit: 120
      constraints:
        use_input: false
        use_output: false
        use_nn: false
        use_line: false
        use_n1: false
        use_n1_redispatch: false
        use_ed: true

  - id: she_method_iv_vis_rted_full
    paper_method: Method IV
    comparison_family: she_vis_rted_style_smoke
    name: Method IV - VIS-RTED
    description: Smoke optimized VIS-RTED formulation with reserve link.
    base_config: ../base_optimization.yaml
    overrides:
      solver:
        extra_kwargs:
          TimeLimit: 300
      bounds:
        M_bounds: [2.0, 8.0]
        D_bounds: [0.0, 6.0]
      constraints:
        use_input: true
        use_output: true
        use_nn: true
        use_line: false
        use_n1: false
        use_n1_redispatch: false
        use_ed: true
        nn_mode: milp
        enforce_dispatch_output_link: true
