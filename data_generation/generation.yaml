case: "data_generation/andes_cases/ieee39_full_ibrs.xlsx"
output_dir: "results/to_export"
output_csv: "simulation_results.csv"
seed: 42
n_sims: 10
workers: 1
stream_level: 50

base_load_scale:
  low: 0.3
  high: 1.0

contingency:
  load_step:
    enable: false
    time: 0.1
    scale:
      low: 0.5
      high: 1.5
      # Optional stratified bins for step scale sampling
      bins:
        - {low: 0.5, high: 0.95, prob: 0.1, label: "small"}
        - {low: 0.95, high: 1.05, prob: 0.8, label: "medium"}
        - {low: 1.05, high: 1.5, prob: 0.1, label: "large"}
  line_n1:
    enable: true
    trip_time: 1.0
    line_ids: []          # optional: list of line idx/name; empty means all in-service lines
    max_lines: 1          # optional cap per sim_id; 0 means no cap

ibr:
  model: "REGCV1"
  n_ibr: 4
  indices: []
  M_range: [2.0, 8.0]
  D_range: [0.0, 6.0]
  # M_range/D_range also accept:
  # M_range:
  #   bins:
  #     - {low: 0.1, high: 1.0, prob: 0.5, label: "low"}
  #     - {low: 1.0, high: 3.0, prob: 0.3, label: "mid"}
  #     - {low: 3.0, high: 6.0, prob: 0.2, label: "high"}
  #   log_uniform: false

load:
  pq_names: ["PQ_1", "PQ_2", "PQ_3", "PQ_4", "PQ_5", "PQ_6", "PQ_7", "PQ_8", "PQ_9", "PQ_10", "PQ_11", "PQ_12", "PQ_13", "PQ_14", "PQ_15", "PQ_16", "PQ_17", "PQ_18", "PQ_19"]
  pq_bus_ids: []
  scale_pv: false
  owners: []   # optional: only apply step to PQs whose owner is in this list (base scale still hits all)

ed:
  enable: true
  ibr_idx: [0,5,7,8]   # indices in generator dispatch vector (PV+Slack order) treated as IBRs for cost
  genrou_costs:
    a: {low: 5.0, high: 15.0}
    b: {low: 0.5, high: 2}
    c: {low: 0.05, high: 0.15}
  regcv1_costs:
    a: {low: 1.0, high: 10.0}
    b: {low: 0.1, high: 1}
    c: {low: 0.01, high: 0.1}
  solver: "OSQP"
  verbose: true

tds:
  t_end: 20.0
  t_step: 0.1
  method: "backeuler"
  max_iter: 35
  tol: 1.0e-3
  honest: 1
  fixt: 0
  shrinkt: 1
  criteria: 0
  no_tqdm: true

plotter:
  export: true
  subdir: "plotter"
