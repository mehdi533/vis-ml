case: "/home/abdallah/vis-ml/data_generation/andes_cases/ieee39_full_ibrs.xlsx"
output_dir: "results/to_export"
output_csv: "simulation_results.csv"
seed: 42
n_sims: 1
stream_level: 50

base_load_scale:
  low: 0.3
  high: 1.2

load_step_scale:
  low: 0.6
  high: 1.2

ibr:
  model: "REGCV1"
  n_ibr: 4
  indices: []
  M_range: [0.0, 6.0]
  D_range: [0.0, 6.0]

load:
  pq_names: ["PQ_1", "PQ_2", "PQ_3", "PQ_4", "PQ_5", "PQ_6", "PQ_7", "PQ_8", "PQ_9", "PQ_10", "PQ_11", "PQ_12", "PQ_13", "PQ_14", "PQ_15", "PQ_16", "PQ_17", "PQ_18", "PQ_19"]
  pq_bus_ids: []
  scale_pv: false

tds:
  t_end: 20.0
  t_step: 0.1
  load_step_time: 1.0
  method: "backeuler"
  max_iter: 35
  tol: 1.0e-3
  honest: 1
  fixt: 0
  shrinkt: 1
  criteria: 0
  no_tqdm: true

plotter:
  export: true
  subdir: "plotter"
