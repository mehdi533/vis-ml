run:
  case_label: vis_formulation_comparison_demo
  output_root: results/presentation_vis/freq_tightening
  random_seed: 42
  save_csv: true
  save_metadata: true
  run_replay: true
  generated_configs_root: ""            # optional override for generated suite/replay/trace config files

system:
  sbase: 100.0
  base_load_scale: 0.9
  load_step_time_s: 1.0
  disturbance_family: global_mismatch        # global_mismatch | zone_mismatch | line_outage | mixed
  disturbance_scale: 1.25
  zone_id: null                              # used when disturbance_family=zone_mismatch
  contingency_label: none                  # e.g. line_022 or 22
  contingency_mode: none                  # none | single_line | screened_set | topk

formulations:
  run_A_ed_only: true
  run_B_ed_line: false
  run_C_ed_line_n1: false
  run_D_ed_surrogate: true
  run_E_full: false
  run_no_vi_reference: false                 # replay-only reference trace (M=D=0 override)

security_limits:
  rocof_lim_hz_per_s: 10
  delta_f_lim_hz: 80
  enforce_delta_p_limits: true
  delta_p_mode: existing_repo_mode           # predicted headroom | physical headroom | existing_repo_mode

network_security:
  enforce_line_limits: true
  enforce_n1_redispatch: false
  topk_contingencies: null                   # used when contingency_mode=topk
  screened_contingency_set_name: null        # used when contingency_mode=screened_set
  screened_contingency_source: results/thesis_optimization_results/results/mtlsh_topk_screening/global/screening_sets.json

surrogate:
  enabled: true
  model_bundle_path: ""                     # optional override of model.model_dir
  scaler_bundle_path: ""                    # optional override (dir with x_scaler.pkl/y_scaler.pkl)
  export_name: retained_surrogate
  embedding_mode: milp                       # existing repo mode (e.g. milp)
  retained_architecture_name: ""            # optional override of model.type

vis_bounds:
  m_min: 0.0
  m_max: 8.0
  d_min: 0.0
  d_max: 6.0

comparison:
  run_default_bounds_case: true
  run_tight_bounds_case: false
  tight_case_suffix: tight
  default_case_suffix: default

logging:
  save_solver_logs: true
  save_intermediate_schedule_tables: true
  save_time_series: true
  trajectory_time_window_s: [0.0, 15.0]
  trajectory_sampling_step: 0.05
  save_per_unit_and_mw_versions: true
  log_tail_lines: 120
