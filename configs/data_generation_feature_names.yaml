metadata:
  fields:
    - sim_id
    - seed
    - success
    - cont_type
    - contingency_time
    - line_uid
    - line_from_bus
    - line_to_bus
    - ed_enabled
    - ed_solver
    - ed_status
    - ed_total_cost
    - ed_constant_cost
    - ed_energy_cost
    - ed_reserve_cost
    - ed_quadratic_cost

x_op:
  scalar_fields:
    - base_load_scale
    - base_load_p_total
    - base_load_q_total
    - total_load_p_prefault
    - total_load_q_prefault
    - total_gen_p_prefault
    - total_gen_q_prefault
    - reserve_p_total_prefault
    - reserve_q_total_prefault
    - reserve_p_genrou
    - reserve_p_ibr
    - reserve_q_genrou
    - reserve_q_ibr
    - bus_v_min_prefault
    - bus_v_max_prefault
    - bus_v_mean_prefault
    - bus_v_std_prefault
    - bus_v_max_abs_dev_prefault
    - bus_angle_min_prefault
    - bus_angle_max_prefault
    - bus_angle_spread_prefault
    - n_buses
    - n_lines
    - n_pq_loads
    - n_genrou
    - n_regcv1
  prefixes:
    pq_p_base: "P_BASE_"
    pq_q_base: "Q_BASE_"
    # initial_state: "x0__"

x_cont:
  load_scalar_fields:
    - load_step_scale
    - load_step_time
    - DELTA_PQ_tot
  line_identity_fields:
    - line_rating
    - line_fn
    - line_Vn1
    - line_Vn2
    - line_r
    - line_x
    - line_b
    - line_g
    - line_b1
    - line_g1
    - line_b2
    - line_g2
    - line_trans
    - line_tap
    - line_phi
    - line_x_over_r
  line_flow_fields:
    - pre_fault_flow
    - pre_fault_loading
    - pre_p_from
    - pre_p_to
    - pre_loading_from
    - pre_loading_to
    - pre_flow_direction_p
  line_bus_fields:
    - pre_v_from
    - pre_v_to
    - pre_theta_from
    - pre_theta_to
    - pre_delta_theta
    - bus_degree_from
    - bus_degree_to
  line_severity_fields:
    - is_bridge
    - n_components_after_trip
    - largest_component_fraction_after_trip
    - system_max_loading_prefault
    - system_mean_loading_prefault
    - system_top5_loading_mean_prefault
    - ptdf_l1_norm_outaged_line
    - max_abs_lodf_row
    - predicted_max_post_cont_loading_dc
  prefixes:
    pq_delta_p: "DELTA_P_"
    owner_delta_p: "DELTA_P_OWNER_"
    line_one_hot: "line_oh_uid_"

x_sched:
  scalar_fields:
    - M_agg
    - D_agg
    - P_GENROU_TOTAL
    - P_REGCV1_TOTAL
    - P_DISPATCH_TOTAL
    - P_REGCV1_SHARE
  prefixes:
    M: "M_"
    D: "D_"
    p_genrou: "P_GENROU_"
    p_regcv1: "P_REGCV1_"
    p_genrou_reserve: "P_GENROU_RESERVE_"
    p_regcv1_reserve: "P_REGCV1_RESERVE_"

y:
  coi_fields:
    - time_max_dev
    - time_max_rocof
    - f_ss_COI
    - f_min_COI
    - f_max_COI
    - t_settle_COI
    - rocof_COI
    - rocof_abs_COI
    - rocof_mean_COI
    - rocof_rms_COI
    - dev_COI
    - dev_abs_COI
  bus_frequency_summary_fields:
    - bus_freq_max_abs_dev_any
    - bus_freq_mean_max_abs_dev
    - bus_freq_p95_max_abs_dev
    - bus_freq_nadir_min
    - bus_freq_zenith_max
    - bus_freq_n_buses_over_0p2
    - bus_freq_n_buses_over_0p5
    - bus_rocof_max_abs_any
    - bus_rocof_mean_max_abs
    - bus_rocof_p95_max_abs
    - bus_rocof_min_any
    - bus_rocof_max_any
  bus_voltage_summary_fields:
    - bus_v_max_abs_dev_any
    - bus_v_mean_max_abs_dev
    - bus_v_p95_max_abs_dev
    - bus_v_min_any
    - bus_v_max_any
    - bus_v_n_buses_below_0p95
    - bus_v_n_buses_above_1p05
  prefixes:
    delta_p_ibr: "Delta_P_IBR_"
    delta_p_ibr_abs: "Delta_P_IBR_abs_"
    bus_freq_max_abs_dev: "bus_freq_max_abs_dev_"
    bus_v_max_abs_dev: "bus_v_max_abs_dev_"
    bus_rocof_max_abs: "bus_rocof_max_abs_"

diagnostics:
  fields:
    - step_bin_label
    - M_bin_label
    - D_bin_label
