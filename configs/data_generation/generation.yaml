case: "data_generation/andes_cases/ieee39_full_ibrs.xlsx"
output_dir: "results/to_export_no_step_ed_test"
output_csv: "simulation_results.csv"
feature_names_path: "configs/shared/data_generation_feature_names.yaml"
seed: 42
n_sims: 1
workers: 1
stream_level: 50

features:
  include_initial_state: true  # set false to skip x0__ columns

base_load_scale:
  low: 0.5
  high: 1

contingency:
  load_step:
    enable: true
    time: 1
    scale:
      low: 1.1
      high: 1.4
      # Optional stratified bins for step scale sampling
      # bins:
      #   - {low: 0.5, high: 0.95, prob: 0.0, label: "small"}
      #   - {low: 0.95, high: 1.05, prob: 0.2, label: "medium"}
      #   - {low: 1.05, high: 1.5, prob: 0.8, label: "large"}
  line_n1:
    enable: false
    trip_time: 1.0
    line_ids: ["Line_44"]          # optional: list of line idx/name; empty means all in-service lines
    max_lines: 1          # optional cap per sim_id; 0 means no cap

ibr:
  model: "REGCV1"
  n_ibr: 4
  indices: [0,5,7,8]
  M_range: [0.0, 8.0]
  D_range: [0.0, 6.0]
  # M_range/D_range also accept:
  # M_range:
  #   bins:
  #     - {low: 0.1, high: 1.0, prob: 0.5, label: "low"}
  #     - {low: 1.0, high: 3.0, prob: 0.3, label: "mid"}
  #     - {low: 3.0, high: 6.0, prob: 0.2, label: "high"}
  #   log_uniform: false

load:
  pq_names: ["PQ_1", "PQ_2", "PQ_3", "PQ_4", "PQ_5", "PQ_6", "PQ_7", "PQ_8", "PQ_9", "PQ_10", "PQ_11", "PQ_12", "PQ_13", "PQ_14", "PQ_15", "PQ_16", "PQ_17", "PQ_18", "PQ_19"]
  pq_bus_ids: []
  scale_pv: true
  owners: []   # optional: only apply step to PQs whose owner is in this list (base scale still hits all)

ed:
  enable: true
  ibr_idx: [0,5,7,8]   # fallback only; code now derives IBR positions from REGCV1.gen when available
  cost_table_path: "configs/shared/ieee39_regcv1_dispatch_costs.yaml"
  solver: "OSQP"
  verbose: true
  line_limits_enable: true

tds:
  t_end: 10.0
  t_step: 0.1
  method: "backeuler"
  max_iter: 35
  tol: 1.0e-3
  honest: 1
  fixt: 0
  shrinkt: 1
  criteria: 0
  no_tqdm: true

debug:
  save_coi_plots: true
