name: chapter5_optimization_formulation_comparison_debug_local
baseline_id: ed_debug

results_root: ../../local_validation/debug_local/formulations

output:
  summary_csv: ../../local_validation/debug_local/formulation_comparison_debug_local_summary.csv
  summary_markdown: ../../local_validation/debug_local/formulation_comparison_debug_local_summary.md
  summary_json: ../../local_validation/debug_local/formulation_comparison_debug_local_summary.json

runs:
  - id: ed_debug
    name: ED (Debug Local)
    description: Fast local ED smoke test.
    base_config: ../base_optimization.yaml
    overrides:
      solver:
        name: GUROBI
        verbose: false
        reoptimize: false
        feasibility_checks: false
        extra_kwargs:
          TimeLimit: 60
          MIPGap: 0.001
      constraints:
        use_input: false
        use_output: false
        use_nn: false
        use_line: false
        use_n1: false
        use_n1_redispatch: false
        use_ed: true

  - id: ed_line_debug
    name: ED + Line (Debug Local)
    description: Fast local line-constraint smoke test.
    base_config: ../base_optimization.yaml
    overrides:
      solver:
        name: GUROBI
        verbose: false
        reoptimize: false
        feasibility_checks: false
        extra_kwargs:
          TimeLimit: 60
          MIPGap: 0.001
      constraints:
        use_input: false
        use_output: false
        use_nn: false
        use_line: true
        use_n1: false
        use_n1_redispatch: false
        use_ed: true

  - id: ed_surrogate_debug
    name: ED + Surrogate (Debug Local)
    description: Fast local surrogate embedding smoke test (fixed-pattern NN).
    base_config: ../base_optimization.yaml
    overrides:
      solver:
        name: GUROBI
        verbose: false
        reoptimize: false
        feasibility_checks: false
        extra_kwargs:
          TimeLimit: 120
          MIPGap: 0.001
      constraints:
        use_input: true
        use_output: true
        use_nn: true
        use_line: false
        use_n1: false
        use_n1_redispatch: false
        use_ed: true
        nn_mode: milp
        enforce_dispatch_output_link: false

  - id: ed_line_surrogate_debug
    name: ED + Line + Surrogate (Debug Local)
    description: Fast local line + surrogate smoke test (fixed-pattern NN).
    base_config: ../base_optimization.yaml
    overrides:
      solver:
        name: GUROBI
        verbose: false
        reoptimize: false
        feasibility_checks: false
        extra_kwargs:
          TimeLimit: 120
          MIPGap: 0.001
      constraints:
        use_input: true
        use_output: true
        use_nn: true
        use_line: true
        use_n1: false
        use_n1_redispatch: false
        use_ed: true
        nn_mode: milp
        enforce_dispatch_output_link: false
