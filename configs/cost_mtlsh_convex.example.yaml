# Cost/model config for convex scheduling (mtlsh variant)
model:
  type: MTLSharedHeads
  state_dict: models_trained/MTLSH__mse__minmax__seed42/vis_mtlsh_state_dict_best.pt
  in_dim: 46
  n_tasks: 6
  shared_sizes: [64]
  head_sizes: [32]
  dropout: 0.0
  convex: true
  out_dim: 6
  hidden_sizes: [256, 128]

features:
  x_features: [
    "base_load_scale","load_step_scale","base_load_p_total","base_load_q_total","DELTA_PQ_tot",
    "M_1","D_1","M_2","D_2","M_3","D_3","M_4","D_4",
    "DELTA_P_PQ_1","DELTA_P_PQ_2","DELTA_P_PQ_3","DELTA_P_PQ_4","DELTA_P_PQ_5","DELTA_P_PQ_6",
    "DELTA_P_PQ_7","DELTA_P_PQ_8","DELTA_P_PQ_9","DELTA_P_PQ_10","DELTA_P_PQ_11","DELTA_P_PQ_12",
    "DELTA_P_PQ_13","DELTA_P_PQ_14","DELTA_P_PQ_15","DELTA_P_PQ_16","DELTA_P_PQ_17","DELTA_P_PQ_18","DELTA_P_PQ_19",
    "DELTA_P_OWNER_1","DELTA_P_OWNER_2","DELTA_P_OWNER_3","DELTA_P_OWNER_4",
    "P_GENROU_1","P_GENROU_2","P_GENROU_3","P_GENROU_4","P_GENROU_5","P_GENROU_6",
    "P_REGCV1_1","P_REGCV1_2","P_REGCV1_3","P_REGCV1_4"
  ]
  y_features: ["dev_COI","rocof_COI","Delta_P_IBR_1","Delta_P_IBR_2","Delta_P_IBR_3","Delta_P_IBR_4"]

scalers:
  x_scaler_path: models_trained/MTLSH__mse__minmax__seed42/x_scaler.pkl
  y_scaler_path: models_trained/MTLSH__mse__minmax__seed42/y_scaler.pkl

ibr_idx: [0,5,7,8]

line_flow:
  enable: true
  source: pandapower

bounds:
  training_data: results/to_export/simulation_results.csv
  drop_cols: [sim_id, seed, success, load_step_time, time_max_dev, plotter_csv, step_bin_label, M_bin_label, D_bin_label]
  use_scaler_for_bounds: true
  M_bounds: [2,8]
  D_bounds: [0,6]
  x_min: []
  x_max: []
  y_min: [-0.5,-0.05,-5,-5,-5,-5]
  y_max: [0.5,0.5,5,5,5,5]

ed_costs:
  a: [1.0, 10.0, 10.0, 10.0, 10.0, 1.0, 10.0, 1.0, 1.0, 10.0]
  b: [0.5, 5.0, 5.0, 5.0, 5.0, 0.5, 5.0, 0.5, 0.5, 5.0]
  c: [0.01, 0.2, 0.2, 0.2, 0.2, 0.01, 0.2, 0.01, 0.01, 0.2]
