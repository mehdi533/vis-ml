formulation:
  id: ieee118
  name: IEEE118
  description: Fast end-to-end smoke of the scheduler using the free SCIP solver and
    the smoke optimization-ready MTLSH.
system:
  case: data_generation/andes_cases/ieee118_ibrs.xlsx
  frequency_hz: 50.0
scenario:
  base_scale: 0.6
  step_scale: 1.1
  load_step_time: 1.0
seed:
  M: 0.0
  D: 0.0
model:
  type: MTLSH
  model_dir: results/ieee118/models_opt_ready/MTLSH__kendall__minmax__seed42
  retain_reason: Smoke optimization-ready MTLSH (M_i, D_i, M_agg, D_agg only).
  in_dim: 555
  n_tasks: 6
  shared_sizes:
  - 32
  head_sizes:
  - 16
  dropout: 0.0
  convex: false
features:
  strict_from_system: true
  contingency_mode: load_mismatch
  x_features_from_registry: false
  x_features_from_model_dir: true
  feature_names_path: configs/shared/data_generation_feature_names.yaml
  registry_feature_groups:
  - x_op
  - x_cont
  - x_sched
  exclude_prefixes:
  - x0__
  registry_filter_to_buildable: true
  registry_align_to_model_contract: true
  registry_include_unbuildable_model_features: false
  missing_feature_source: none
  fixed_source_override_non_sched: false
  allow_missing_features: false
  allow_constant_fill_for_unresolved_missing: false
  missing_fill_value: 0.0
outputs:
  y_names:
  - rocof_COI
  - dev_COI
  - Delta_P_IBR_1
  - Delta_P_IBR_2
  - Delta_P_IBR_3
  - Delta_P_IBR_4
ibr:
  indices:
  - 0
  - 5
  - 7
  - 8
bounds:
  M_bounds:
  - 0
  - 8.0
  D_bounds:
  - 0
  - 6.0
  y_min:
  - -100
  - -100
  - -100
  - -100
  - -100
  - -100
  y_max:
  - 100
  - 100
  - 100
  - 100
  - 100
  - 100
constraints:
  use_input: true
  use_output: true
  use_nn: true
  use_line: false
  use_n1: false
  use_n1_redispatch: false
  exclude_islanding_critical_n1: true
  exclude_n1_line_uids: []
  use_ed: false
  nn_mode: milp
  y_ibr_idx:
  - 2
  - 3
  - 4
  - 5
  enforce_dispatch_output_link: false
  tie_breaker: 0.0
ed_costs:
  cost_table_path: configs/shared/ieee118_regcv1_dispatch_costs.yaml
solver:
  name: SCIP
  verbose: false
  reoptimize: false
  feasibility_checks: false
plots:
  enabled: false
  dir: results/smoke/optimization/plots
  m_d: false
  pred_vs_opt: false
  dispatch: false
  network: false
  network_layout: kamada
output:
  results_dir: results/ieee118/optimization/formulations
  run_tag: ieee118
  log_file: results/ieee118/optimization/formulations/ieee118/ieee118.log
  fail_on_infeasible: false
