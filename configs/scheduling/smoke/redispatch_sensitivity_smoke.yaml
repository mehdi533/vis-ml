name: chapter5_optional_redispatch_sensitivity_smoke
baseline_id: ed_line_n1_surrogate

results_root: ../../../results/thesis_optimization_results/local_validation/smoke/redispatch_sensitivity/formulations

output:
  summary_csv: ../../../results/thesis_optimization_results/local_validation/smoke/redispatch_sensitivity_smoke_summary.csv
  summary_markdown: ../../../results/thesis_optimization_results/local_validation/smoke/redispatch_sensitivity_smoke_summary.md
  summary_json: ../../../results/thesis_optimization_results/local_validation/smoke/redispatch_sensitivity_smoke_summary.json

runs:
  - id: ed_line_n1_surrogate
    name: Full Preventive Baseline
    description: Smoke preventive baseline without redispatch recourse.
    base_config: ../base_optimization.yaml
    overrides:
      solver:
        extra_kwargs:
          TimeLimit: 300
      constraints:
        use_input: true
        use_output: true
        use_nn: true
        use_line: true
        use_n1: true
        use_n1_redispatch: false
        use_ed: true
        nn_mode: milp
        enforce_dispatch_output_link: true

  - id: ed_line_n1_surrogate_redispatch
    name: Redispatch Sensitivity
    description: Smoke redispatch-recourse run.
    base_config: ../base_optimization.yaml
    overrides:
      solver:
        extra_kwargs:
          TimeLimit: 300
      constraints:
        use_input: true
        use_output: true
        use_nn: true
        use_line: true
        use_n1: true
        use_n1_redispatch: true
        use_ed: true
        nn_mode: milp
        enforce_dispatch_output_link: true
