name: chapter5_area_vis_comparison_smoke
baseline_id: she_method_i_rted

results_root: ../../../results/thesis_optimization_results/local_validation/smoke/area_vis_formulations

output:
  summary_csv: ../../../results/thesis_optimization_results/local_validation/smoke/area_vis_comparison_smoke_summary.csv
  summary_markdown: ../../../results/thesis_optimization_results/local_validation/smoke/area_vis_comparison_smoke_summary.md
  summary_json: ../../../results/thesis_optimization_results/local_validation/smoke/area_vis_comparison_smoke_summary.json

runs:
  - id: she_method_i_rted
    paper_method: Method I
    comparison_family: she_vis_area_comparison_smoke
    name: Method I - ED / RTED
    description: Smoke ED baseline for area-wise VIS comparison.
    base_config: ../base_optimization.yaml
    overrides:
      solver:
        extra_kwargs:
          TimeLimit: 120
      constraints:
        use_input: false
        use_output: false
        use_nn: false
        use_line: false
        use_n1: false
        use_n1_redispatch: false
        use_ed: true

  - id: she_method_iv_vis_rted_area_tied
    paper_method: Method IV-A
    comparison_family: she_vis_area_comparison_smoke
    name: Method IV-A - VIS-RTED (Area-Tied M/D)
    description: Smoke area-tied VIS formulation.
    base_config: ../base_optimization.yaml
    overrides:
      solver:
        extra_kwargs:
          TimeLimit: 300
      bounds:
        M_bounds: [2.0, 8.0]
        D_bounds: [0.0, 6.0]
      constraints:
        use_input: true
        use_output: true
        use_nn: true
        use_line: false
        use_n1: false
        use_n1_redispatch: false
        use_ed: true
        nn_mode: milp
        enforce_dispatch_output_link: true
        vis_tie_groups:
          - [0, 2]
          - [1, 3]
