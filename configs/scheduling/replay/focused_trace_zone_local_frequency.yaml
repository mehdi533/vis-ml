tds:
  t_end: 20.0
  t_step: 0.01
  method: backeuler
  no_tqdm: true
  criteria: 0

contingency:
  type: load_step
  time: 1.0
  scale: 1.5

limits:
  frequency_hz: 50.0
  delta_f_hz: 0.8
  rocof_hz_per_s: 1.0

output:
  directory: ../../../results/thesis_optimization_results/local_validation/replay_trace_zone_local_frequency
  style_config: configs/figure/thesis_plot_style.yaml
  title: ""
  panel_title: ""
  plot_mode: topk_dual
  ibr_scale: 100.0
  ibr_unit: MW
  bus_selection:
    mode: explicit
    bus_ids: [28, 29]

runs:
  - label: "Global Step (all loads)"
    summary_json: ../../results/zone_mismatch_vis_sensitivity_formulations/global_uniform/retained_vis/retained_vis__global_uniform_summary.json
    linestyle: "-"
    color: "#1f77b4"
  - label: "Local Step (bus 28/29)"
    summary_json: ../../results/zone_mismatch_vis_sensitivity_formulations/global_uniform/retained_vis/retained_vis__global_uniform_summary.json
    linestyle: "--"
    color: "#d62728"
    contingency:
      scale: 2.0
      pq_target_bus_ids: [28, 29]
