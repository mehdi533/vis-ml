tds:
  t_end: 20.0
  t_step: 0.01
  method: backeuler
  no_tqdm: true
  criteria: 0

contingency:
  type: line_trip
  time: 1.0
  line_uid: 19

limits:
  frequency_hz: 50.0
  delta_f_hz: 0.8
  rocof_hz_per_s: 1.0

output:
  directory: ../../../results/thesis_optimization_results/local_validation/replay_trace_line_robustness
  style_config: configs/figure/thesis_plot_style.yaml
  title: ""
  panel_title: ""
  plot_mode: topk_dual
  ibr_scale: 100.0
  ibr_unit: MW

runs:
  - label: "A: ED"
    summary_json: ../../results/formulations/ed/ed_summary.json
    linestyle: "-"
    color: "#1f77b4"
  - label: "C: ED + Line + N-1"
    summary_json: ../../results/formulations/ed_line_n1/ed_line_n1_summary.json
    linestyle: "--"
    color: "#ff7f0e"
  - label: "E: Full preventive"
    summary_json: ../../results/formulations/ed_line_n1_surrogate/ed_line_n1_surrogate_summary.json
    linestyle: "-"
    color: "#7b2cbf"
