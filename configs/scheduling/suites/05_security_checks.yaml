name: chapter5_security_checks_full_formulation
baseline_id: ed_line_n1_surrogate

results_root: ../../results/security_checks

output:
  summary_csv: ../../results/security_checks_summary.csv
  summary_markdown: ../../results/security_checks_summary.md
  summary_json: ../../results/security_checks_summary.json

runs:
  - id: ed_line_n1_surrogate
    name: ED + Line + N-1 + Surrogate
    description: Main preventive formulation for security-check reporting before replay.
    base_config: ../base_optimization.yaml
    overrides:
      solver:
        extra_kwargs:
          TimeLimit: 3600
      constraints:
        use_input: true
        use_output: true
        use_nn: true
        use_line: true
        use_n1: true
        use_n1_redispatch: false
        use_ed: true
        nn_mode: milp
        enforce_dispatch_output_link: true
