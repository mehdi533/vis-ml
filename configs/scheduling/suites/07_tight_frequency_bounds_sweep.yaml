name: chapter5_tight_frequency_bounds_sweep
baseline_id: retained_default

results_root: ../../results/tight_frequency_bounds_sweep

output:
  summary_csv: ../../results/tight_frequency_bounds_sweep_summary.csv
  summary_markdown: ../../results/tight_frequency_bounds_sweep_summary.md
  summary_json: ../../results/tight_frequency_bounds_sweep_summary.json

scenarios:
  - id: global_b0p750_s1p200
    name: global_b0p750_s1p200
    description: Uniform active/reactive load step across all PQ loads.
    overrides:
      scenario:
        id: global_b0p750_s1p200
        name: global_b0p750_s1p200
        description: Uniform active/reactive load step across all PQ loads.
        base_scale: 0.75
        step_scale: 1.2
      features:
        contingency_mode: load_mismatch

runs:
  - id: retained_default
    comparison_family: tight_frequency_bounds
    name: Retained default bounds
    description: Retained preventive formulation with the deployed default surrogate box.
    base_config: ../base_optimization.yaml
    overrides:
      solver:
        extra_kwargs:
          TimeLimit: 3600
      constraints:
        use_input: true
        use_output: true
        use_nn: true
        use_line: true
        use_n1: true
        use_n1_redispatch: false
        use_ed: true
        nn_mode: milp
        enforce_dispatch_output_link: true
      bounds:
        y_min: [-1.0, -0.8, -5.0, -5.0, -5.0, -5.0]
        y_max: [1.0, 0.8, 5.0, 5.0, 5.0, 5.0]

  - id: retained_df0p60_rocof0p75
    comparison_family: tight_frequency_bounds
    name: Tightened bounds A
    description: Retained formulation with |\Delta f| <= 0.60 and |RoCoF| <= 0.75.
    base_config: ../base_optimization.yaml
    overrides:
      solver:
