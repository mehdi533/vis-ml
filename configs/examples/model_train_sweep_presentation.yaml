# Presentation example: model training sweep workflow
# Run:
#   ../venv/bin/python models/train_sweep.py --config configs/examples/model_train_sweep_presentation.yaml

output_dir: results/presentation_examples/model_training
skip_if_exists: false
seed: 42

model:
  shared_sizes: [128, 64]
  head_sizes: [32]
  hidden_sizes: [128, 64, 32]
  activation: relu
  dropout: 0.0
  group_shared_sizes: [64, 32]
  # Optional grouped heads (for grouped models):
  # group_head_indices: [[0, 1], [2, 3, 4, 5]]
  # Optional attention (for *_ATT models):
  # attention_hidden_dim: 32
  # attention_temperature: 1.0
  # attention_dropout: 0.0
  # Optional KAN:
  # kan_grid_size: 8
  # kan_grid_min: -1.0
  # kan_grid_max: 1.0
  # Optional PICNN split:
  # u_feature_cols: [M_1, D_1, M_2, D_2, M_3, D_3, M_4, D_4]

data:
  csv_path: results/thesis_data_generation_results/results/simulation_results.csv
  feature_names_path: configs/shared/data_generation_feature_names.yaml
  use_registry_feature_allowlist: true
  drop_metadata_fields: true
  drop_diagnostic_fields: true
  target_cols: [rocof_COI, dev_COI, Delta_P_IBR_1, Delta_P_IBR_2, Delta_P_IBR_3, Delta_P_IBR_4]
  drop_cols:
    - sim_id
    - seed
    - success
    - cont_type
    - contingency_time
    - line_uid
    - line_name
    - line_from_bus
    - line_to_bus
    - time_max_dev
    - plotter_csv
  drop_prefixes: [x0__, Delta_P_IBR_abs_, bus_freq_max_abs_dev_, bus_v_max_abs_dev_]
  ignore_missing_drop_cols: true
  # Optional extra controls:
  # feature_cols: [base_load_scale, M_1, D_1]
  # allowed_feature_cols: [base_load_scale, M_1, D_1]
  # allowed_feature_prefixes: [M_, D_, P_GENROU_, P_REGCV1_]
  # missing_fill_value: -1.0

split:
  test_size: 0.3
  val_fraction: 0.5
  random_state: 42

training:
  epochs: 10
  lr: 0.001
  weight_decay: 0.0001
  batch_train: 512
  batch_eval: 1024
  loss_weights: []
  use_lr_scheduler: true
  lr_scheduler_patience: 8
  lr_scheduler_factor: 0.5
  lr_scheduler_min_lr: 1.0e-7
  # Optional:
  # save_test_predictions: true

plotting:
  nominal_frequency_hz: 50.0
  system_base_mva: 100.0
  case_path: data_generation/andes_cases/ieee39_full_ibrs.xlsx

sweep:
  # Keep this minimal for presentation speed; expand later if needed.
  models: [MTLSH]
  losses: [mse]
  scalers: [minmax]
  seeds: [42]

  # Optional grid search dimensions:
  model: {}
  training: {}
  data: {}
  # Example:
  # model:
  #   shared_sizes:
  #     values:
  #       - [128, 64]
  #       - [256, 128]
