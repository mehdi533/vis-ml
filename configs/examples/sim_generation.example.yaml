# Simulation + data generation config (used by data_generation/run_sims.py, experiments/run_forecast_opt_sim.py, scheduling/problem*.py)
case: "data_generation/andes_cases/ieee39_full_ibrs.xlsx"
output_dir: "results/sims"
output_csv: "simulation_results.csv"
seed: 42
n_sims: 25
workers: 4
stream_level: 30

base_load_scale:
  low: 0.4
  high: 1.1

contingency:
  load_step:
    enable: true
    time: 0.1
    scale:
      low: 0.7
      high: 1.3
  line_n1:
    enable: true
    trip_time: 1.0
    line_ids: []     # empty → choose any in-service line
    max_lines: 1

ibr:
  model: "REGCV1"
  n_ibr: 4
  indices: []       # optional; empty → first n_ibr IBRs in case file
  M_range: [2.0, 8.0]
  D_range: [0.0, 6.0]

load:
  pq_names: ["PQ_1","PQ_2","PQ_3","PQ_4","PQ_5","PQ_6","PQ_7","PQ_8","PQ_9","PQ_10","PQ_11","PQ_12","PQ_13","PQ_14","PQ_15","PQ_16","PQ_17","PQ_18","PQ_19"]
  pq_bus_ids: []
  scale_pv: false

ed:
  enable: true
  ibr_idx: [0,5,7,8]
  genrou_costs:
    a: {low: 5.0, high: 15.0}
    b: {low: 0.5, high: 2.0}
    c: {low: 0.05, high: 0.15}
  regcv1_costs:
    a: {low: 1.0, high: 10.0}
    b: {low: 0.1, high: 1.0}
    c: {low: 0.01, high: 0.1}
  solver: "OSQP"
  verbose: false
  line_limits_enable: true

tds:
  t_end: 20.0
  t_step: 0.05
  method: "backeuler"
  max_iter: 35
  tol: 1.0e-3
  honest: 1
  fixt: 0
  shrinkt: 1
  criteria: 0
  no_tqdm: true

plotter:
  export: true
  subdir: "plotter"
