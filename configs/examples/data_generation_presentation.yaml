# Presentation example: data generation workflow
# Run:
#   ../venv/bin/python data_generation/run_sims.py --config configs/examples/data_generation_presentation.yaml

case: "data_generation/andes_cases/ieee39_full_ibrs.xlsx"
output_dir: "results/presentation_examples/data_generation"
output_csv: "simulation_results.csv"
feature_names_path: "configs/shared/data_generation_feature_names.yaml"
seed: 42
n_sims: 16
workers: 4
stream_level: 50

features:
  include_initial_state: false

base_load_scale:
  low: 0.5
  high: 1.0

contingency:
  load_step:
    enable: true
    time: 1.0
    scale:
      low: 1.10
      high: 1.40
      # Optional stratified sampling:
      # bins:
      #   - {low: 1.00, high: 1.05, prob: 0.2, label: "small"}
      #   - {low: 1.05, high: 1.20, prob: 0.4, label: "medium"}
      #   - {low: 1.20, high: 1.50, prob: 0.4, label: "large"}
  line_n1:
    enable: false
    trip_time: 1.0
    # Optional subset/cap for line outages:
    # line_ids: ["Line_44", "Line_12"]
    # max_lines: 1

ibr:
  model: "REGCV1"
  n_ibr: 4
  indices: [0, 5, 7, 8]
  M_range: [0.0, 8.0]
  D_range: [0.0, 6.0]
  # Optional binned M/D sampling:
  # M_range:
  #   bins:
  #     - {low: 0.0, high: 1.0, prob: 0.4, label: "low"}
  #     - {low: 1.0, high: 4.0, prob: 0.4, label: "mid"}
  #     - {low: 4.0, high: 8.0, prob: 0.2, label: "high"}

load:
  # Empty list means "all loads"
  pq_names: []
  pq_bus_ids: []
  scale_pv: true
  owners: []
  # Optional zone/owner-focused disturbance:
  # owners: [1, 2]

ed:
  enable: true
  # Fallback only; code also derives from REGCV1 when possible
  ibr_idx: [0, 5, 7, 8]
  cost_table_path: "configs/shared/ieee39_regcv1_dispatch_costs.yaml"
  solver: "OSQP"
  verbose: false
  line_limits_enable: true

tds:
  t_end: 10.0
  t_step: 0.1
  method: "backeuler"
  max_iter: 35
  tol: 1.0e-3
  honest: 1
  fixt: 0
  shrinkt: 1
  criteria: 0
  no_tqdm: true

debug:
  save_coi_plots: true
