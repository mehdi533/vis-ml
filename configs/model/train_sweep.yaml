# Template model training config

output_dir: models_trained
skip_if_exists: false
seed: 42

model:
  shared_sizes: [256, 128]
  head_sizes: [64]
  hidden_sizes: [256, 128, 64]
  activation: relu
  dropout: 0.0
  group_shared_sizes: [128, 64]
  # Optional architecture-specific knobs:
  # group_head_indices: [[0, 1], [2, 3, 4, 5]]
  # attention_hidden_dim: 32
  # attention_temperature: 1.0
  # attention_dropout: 0.0
  # kan_grid_size: 8
  # kan_grid_min: -1.0
  # kan_grid_max: 1.0
  # PICNN/PICNN_MTLSH only (kept commented for now):
  # u_feature_cols: [M_1, D_1, M_2, D_2, M_3, D_3, M_4, D_4]

data:
  csv_path: results/thesis_data_generation_results/results/simulation_results.csv
  feature_names_path: configs/shared/data_generation_feature_names.yaml
  use_registry_feature_allowlist: true
  drop_metadata_fields: true
  drop_diagnostic_fields: true
  target_cols: [rocof_COI, dev_COI, Delta_P_IBR_1, Delta_P_IBR_2, Delta_P_IBR_3, Delta_P_IBR_4]
  drop_cols:
    - sim_id
    - seed
    - success
    - cont_type
    - contingency_time
    - line_uid
    - line_name
    - line_from_bus
    - line_to_bus
    - time_max_dev
    - time_max_rocof
    - f_ss_COI
    - f_min_COI
    - f_max_COI
    - t_settle_COI
    - rocof_abs_COI
    - rocof_mean_COI
    - rocof_rms_COI
    - dev_abs_COI
    - bus_freq_max_abs_dev_any
    - bus_freq_mean_max_abs_dev
    - bus_freq_p95_max_abs_dev
    - bus_freq_nadir_min
    - bus_freq_zenith_max
    - bus_freq_n_buses_over_0p2
    - bus_freq_n_buses_over_0p5
    - bus_v_max_abs_dev_any
    - bus_v_mean_max_abs_dev
    - bus_v_p95_max_abs_dev
    - bus_v_min_any
    - bus_v_max_any
    - bus_v_n_buses_below_0p95
    - bus_v_n_buses_above_1p05
    - step_bin_label
    - M_bin_label
    - D_bin_label
    - plotter_csv
    - is_bridge
    - n_components_after_trip
    - reserve_p_genrou
    - reserve_p_ibr
    - reserve_q_genrou
    - reserve_q_ibr
  drop_prefixes: [x0__, Delta_P_IBR_abs_, bus_freq_max_abs_dev_, bus_v_max_abs_dev_]
  ignore_missing_drop_cols: true
  use_recommended_scalers: false

split:
  test_size: 0.3
  val_fraction: 0.5
  random_state: 42

training:
  epochs: 10
  lr: 0.001
  weight_decay: 0.0001
  batch_train: 512
  batch_eval: 1024
  loss_weights: []
  use_lr_scheduler: true
  lr_scheduler_patience: 8
  lr_scheduler_factor: 0.5
  lr_scheduler_min_lr: 0.0000001

plotting:
  # Defaults previously hardcoded in models/plotting.py
  nominal_frequency_hz: 50.0
  system_base_mva: 100.0
  case_path: data_generation/andes_cases/ieee39_full_ibrs.xlsx
  ibr_device_base_mva:
    1: 1040.0
    2: 1085.7
    3: 970.2
    4: 1684.1

sweep:
  models: ["MTLSH"]
  losses: ["mse"]
  scalers: ["minmax"]
  seeds: [42]
  model: {}
  training: {}
  data: {}
