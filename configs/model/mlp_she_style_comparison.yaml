output_dir: results/thesis_model_results/outputs/mlp_she_style_comparison
skip_if_exists: false
seed: 42

model:
  hidden_sizes: [64]
  activation: relu
  dropout: 0.0

data:
  csv_path: results/thesis_data_generation_results/results/simulation_results.csv
  feature_names_path: configs/shared/data_generation_feature_names.yaml
  use_registry_feature_allowlist: true
  drop_metadata_fields: true
  drop_diagnostic_fields: true
  target_cols: [rocof_COI, dev_COI]
  drop_cols:
    - line_name
    - plotter_csv
    - is_bridge
    - n_components_after_trip
    - reserve_p_genrou
    - reserve_p_ibr
    - reserve_q_genrou
    - reserve_q_ibr
  drop_prefixes: [x0__]
  ignore_missing_drop_cols: true
  use_recommended_scalers: false

split:
  test_size: 0.3
  val_fraction: 0.5
  random_state: 42

training:
  epochs: 1000
  lr: 0.001
  weight_decay: 0.0001
  batch_train: 512
  batch_eval: 1024
  loss_weights: []
  use_lr_scheduler: true
  lr_scheduler_patience: 8
  lr_scheduler_factor: 0.5
  lr_scheduler_min_lr: 1e-7
  save_test_predictions: true

sweep:
  models: [MLP]
  losses: [mse]
  scalers: [minmax]
  seeds: [42]
  model: {}
  training: {}
  data:
    target_cols:
      values:
        - [rocof_COI, dev_COI]
        - [Delta_P_IBR_1, Delta_P_IBR_2, Delta_P_IBR_3, Delta_P_IBR_4]
