figure_pack_name: chapter_context_figures
plot_style_config: configs/figure/thesis_plot_style.yaml

outputs:
  root: results/thesis_figure_results/outputs

system:
  case: data_generation/andes_cases/ieee39_full_ibrs.xlsx
  nominal_frequency_hz: 50.0
  system_base_mva: 100.0
  network_layout: kamada

tds:
  t_end: 10.0
  t_step: 0.02
  method: backeuler
  max_iter: 35
  tol: 1.0e-3
  honest: 1
  fixt: 0
  shrinkt: 1
  criteria: 0
  no_tqdm: true

figure_1_2:
  base_scale: 0.90
  load_step_scale: 1.12
  load_step_time: 1.0
  scale_pv: false
  focus_ibr_unit: 4
  schedules:
    - schedule_id: low_vis
      label: No inertia
      M: 0.0
      D: 0.0
    - schedule_id: medium_vis
      label: Low inertia
      M: 2.0
      D: 1.0
    - schedule_id: high_vis
      label: High inertia
      M: 4.0
      D: 2.0

figure_3_4:
  datasets:
    - family: load_mismatch_only
      label: Global mismatch
      csv: results/thesis_data_generation_results/results/load_mismatch_only/simulation_results.csv
    - family: zone_based_load_mismatch
      label: Zone-based mismatch
      csv: results/thesis_data_generation_results/results/zone_based_load_mismatch/simulation_results.csv

figure_3_3:
  line_limit_unit: pu

figure_3_6:
  benchmark_config: configs/scheduling/thesis_optimization_benchmark.yaml
  representative_outage_mode: highest_selected_severity
  representative_line_uid: 1
  n1_not_considered_line_ids: ["Line_22", "Line_35", "Line_36", "Line_37", "Line_40", "Line_41", "Line_42", "Line_43", "Line_44", "Line_45", "Line_46"]
  base_scale: 1.0
  line_trip_time: 1.0
  M: 3.0
  D: 2.0
