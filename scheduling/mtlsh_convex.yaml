model:
  type: MTLSharedHeads
  state_dict: models_trained/020926/models_mtlsh/MTLSH__mse__minmax__seed42
  in_dim: 51
  n_tasks: 8
  shared_sizes: [256, 128]
  head_sizes: [128, 64]
  dropout: 0.0
  # For MLP models
  out_dim: 8
  hidden_sizes: [256, 128]
  # For MTLGroupedSharedHeads models
  group_shared_configs: []

models:
  type: MLP
  state_dict1: models_trained/020926/models_deltaP/MLP__mse__minmax__seed42/vis_mlp_state_dict_best.pt
  state_dict2: models_trained/020926/models_freq/MLP__mse__minmax__seed42/vis_mlp_state_dict_best.pt
  in_dim: 51
  out_dim: 4
  hidden_sizes: [64]
  dropout: 0.0

features:
  x_features: ["base_load_scale","load_step_scale","base_load_p_total","base_load_q_total","DELTA_PQ_tot","M_1","D_1","M_2","D_2","M_3","D_3","M_4","D_4","DELTA_P_PQ_1","DELTA_Q_PQ_1","DELTA_P_PQ_2","DELTA_Q_PQ_2","DELTA_P_PQ_3","DELTA_Q_PQ_3","DELTA_P_PQ_4","DELTA_Q_PQ_4","DELTA_P_PQ_5","DELTA_Q_PQ_5","DELTA_P_PQ_6","DELTA_Q_PQ_6","DELTA_P_PQ_7","DELTA_Q_PQ_7","DELTA_P_PQ_8","DELTA_Q_PQ_8","DELTA_P_PQ_9","DELTA_Q_PQ_9","DELTA_P_PQ_10","DELTA_Q_PQ_10","DELTA_P_PQ_11","DELTA_Q_PQ_11","DELTA_P_PQ_12","DELTA_Q_PQ_12","DELTA_P_PQ_13","DELTA_Q_PQ_13","DELTA_P_PQ_14","DELTA_Q_PQ_14","DELTA_P_PQ_15","DELTA_Q_PQ_15","DELTA_P_PQ_16","DELTA_Q_PQ_16","DELTA_P_PQ_17","DELTA_Q_PQ_17","DELTA_P_PQ_18","DELTA_Q_PQ_18","DELTA_P_PQ_19","DELTA_Q_PQ_19"]
  y_features: ["rocof_max_COI","rocof_min_COI","devdown_COI","devup_COI","Delta_P_IBR_1","Delta_P_IBR_2","Delta_P_IBR_3","Delta_P_IBR_4"]

scalers:
  x_scaler_path: models_trained/020926/models_mtlsh/MTLSH__mse__minmax__seed42/x_scaler.pkl
  y_scaler_path: models_trained/020926/models_mtlsh/MTLSH__mse__minmax__seed42/y_scaler.pkl
  # Per-model y scalers (the two 4-output MLPs are trained with different y scaling)
  y_scaler_freq_path: models_trained/020926/models_freq/MLP__mse__minmax__seed42/y_scaler.pkl
  y_scaler_dp_path: models_trained/020926/models_deltaP/MLP__mse__minmax__seed42/y_scaler.pkl

ibr_idx: [0,5,7,8]

line_flow:
  enable: true
  source: pandapower
  line_limits: 

bounds:
  training_data: simulation_results.csv
  drop_cols: []
  use_scaler_for_bounds: true
  M_bounds: [2,8]
  D_bounds: [0,4]
  x_min: []
  x_max: []
  y_min: [0,-1,0,0,     -5,-5,-5,-5] # [-0.5, -0.5, -0.2, -0.2, -5, -5, -5, -5]
  y_max: [1,0,2.50,1.5,  5,5,5,5] #[0.5, 0.5, 0.2, 0.2, 5, 5, 5, 5]

# Economic dispatch costs (length must match number of PV units).
ed_costs:
  a: [1.0, 10.0, 10.0, 10.0, 10.0, 1.0, 10.0, 1.0, 1.0, 10.0]
  b: [50, 5, 5, 5, 5, 50, 5, 0.5, 50, 5]
  c: [0.01, 0.2, 0.2, 0.2, 0.2, 0.01, 0.2, 0.01, 0.01, 0.2]
