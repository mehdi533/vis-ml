name: tests

on:
  push:
    branches: [main, master, claude]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -U pip wheel
          pip install -r requirements-core.txt
      - name: Run tests
        run: |
          python -m pytest -q
