output_dir: models_trained
skip_if_exists: false
seed: 42

model:
  shared_sizes: [256, 128]
  head_sizes: [64]
  hidden_sizes: [256, 128, 64]
  activation: relu
  dropout: 0.0
  group_shared_sizes: [128, 64]
  # For PICNN / PICNN_MTLSH only (choose either *_idx or *_cols):
  # u_feature_idx: [0, 1, 2]
  # v_feature_idx: [3, 4, 5]
  u_feature_cols: [M_1, D_1, M_2, D_2, M_3, D_3, M_4, D_4]
  # v_feature_cols: [base_load_scale, load_step_scale]

data:
  csv_path: simulation_results.csv
  target_cols:
    - rocof_COI
    - dev_COI
    - Delta_P_IBR_1
    - Delta_P_IBR_2
    - Delta_P_IBR_3
    - Delta_P_IBR_4
  drop_cols:
    - sim_id
    - seed
    - success
    - load_step_time
    - time_max_dev
    - plotter_csv
    - step_bin_label
    - M_bin_label
    - D_bin_label
  use_recommended_scalers: false

split:
  test_size: 0.3
  val_fraction: 0.5
  random_state: 42

training:
  epochs: 200
  lr: 0.001
  weight_decay: 0.0001
  batch_train: 512
  batch_eval: 1024
  loss_weights: []
  use_lr_scheduler: true
  lr_scheduler_patience: 8
  lr_scheduler_factor: 0.5
  lr_scheduler_min_lr: 0.0000001

sweep:
  models: ["PICNN_MTLSH"]
  losses: ["mse"]
  scalers: ["minmax"]
  seeds: [42]
  training: {}
