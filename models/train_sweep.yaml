output_dir: models_trained
skip_if_exists: false
seed: 42

model:
  shared_sizes: [256, 128]
  head_sizes: [64]
  hidden_sizes: [256, 128, 64]
  activation: relu
  dropout: 0.0
  group_shared_sizes: [128, 64]
  # Optional architecture-specific knobs:
  # group_head_indices: [[0, 1], [2, 3, 4, 5]]
  # attention_hidden_dim: 32
  # attention_temperature: 1.0
  # attention_dropout: 0.0
  # kan_grid_size: 8
  # kan_grid_min: -1.0
  # kan_grid_max: 1.0
  # PICNN/PICNN_MTLSH only (kept commented for now):
  # u_feature_cols: [M_1, D_1, M_2, D_2, M_3, D_3, M_4, D_4]

data:
  csv_path: results/to_export/simulation_results.csv
  target_cols:
    - rocof_COI
    - dev_COI
  drop_cols:
    - Delta_P_IBR_1
    - Delta_P_IBR_2
    - Delta_P_IBR_3
    - Delta_P_IBR_4
    - sim_id
    - seed
    - success
    - time_max_dev
    - cont_type
    - contingency_id
    - line_idx
    - pre_fault_loading
    - step_bin_label
    - M_bin_label
    - D_bin_label
  # Optional: remove whole column families by prefix to avoid label leakage.
  # drop_prefixes: [Delta_P_IBR_abs_, rocof_abs_, dev_abs_]
  use_recommended_scalers: false

split:
  test_size: 0.3
  val_fraction: 0.5
  random_state: 42

training:
  epochs: 1000
  lr: 0.001
  weight_decay: 0.0001
  batch_train: 512
  batch_eval: 1024
  loss_weights: []
  use_lr_scheduler: true
  lr_scheduler_patience: 8
  lr_scheduler_factor: 0.5
  lr_scheduler_min_lr: 0.0000001

sweep:
  models: ["MTLSH"]
  losses: ["mse"]
  scalers: ["minmax"]
  seeds: [42]
  model: {}
  training: {}
  data: {}
